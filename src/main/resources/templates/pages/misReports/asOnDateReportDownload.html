<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layouts/dashboard">
<head>
    <meta charset="UTF-8">
    <title>Physical Progress Reports - As on Date</title>
    <link th:href="@{/css/report/report.css}" rel="stylesheet"/>
</head>
<body>
<div class="content-wrapper" layout:fragment="content"
     style="box-shadow: rgba(9, 30, 66, 0.25) 0px 4px 8px -2px, rgba(9, 30, 66, 0.08) 0px 0px 0px 1px;">
    <div th:fragment="asOnDateReportDownload">
    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-12">
                    <div class="card card-info">
                        <div class="card-header">
                            <h3 class="card-title"
                                style="font-size: 1.125rem">
                                Physical Progress Reports (State Level) - As on Date
                            </h3>
                        </div>
                        <div class="card-body">
                            <a th:unless="${embedded}" th:href="@{/reports/physical-progress-report}" class="btn btn-primary" style="font-size: 13px;">
                                ← Back
                            </a>

                            <div th:if="${error != null}" class="alert alert-danger mt-3" role="alert" th:text="${error}"></div>

                            <form th:action="@{/physicalProgressReports/as-on-date}" method="get" class="mt-3" id="asOnDateDownloadForm">
                                <div class="form-row align-items-end">
                                    <div class="col-md-4 mb-2">
                                        <label for="component">Select Component:</label>
                                        <select id="component" name="component" class="form-control" required
                                                onchange="if (window.updateAsOnDateLimit) { updateAsOnDateLimit(this); }">
                                            <option th:each="c : ${components}" th:value="${c.name()}" th:text="${c.label}"
                                                    th:attr="data-min=${componentMinDates[c.name()]}"
                                                    th:selected="${selectedComponent == c}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-3 mb-2">
                                        <label for="asOnDateDisplay">Select Date (As on):</label>
                                        <input type="text" id="asOnDateDisplay" class="form-control" required readonly
                                               autocomplete="off" placeholder="dd-mm-yyyy"
                                               style="background-color: #fff;"
                                               th:value="${asOnDate != null ? #temporals.format(asOnDate, 'dd-MM-yyyy') : ''}"
                                               th:attr="data-min=${minDate != null ? #temporals.format(minDate, 'yyyy-MM-dd') : ''}, data-max=${maxDate != null ? #temporals.format(maxDate, 'yyyy-MM-dd') : ''}">
                                        <input type="hidden" id="asOnDate" name="asOnDate"
                                               th:value="${asOnDate != null ? #temporals.format(asOnDate, 'yyyy-MM-dd') : ''}">
                                    </div>
                                    <div class="col-md-4 mb-2">
                                        <button type="submit" class="btn btn-primary" style="font-size: 16px;"
                                                th:attr="hx-get=${embedded} ? @{/dolr/physical-progress-as-on-date} : null,
                                                         hx-target=${embedded} ? '#content' : null,
                                                         hx-swap=${embedded} ? 'innerHTML' : null,
                                                         hx-include=${embedded} ? '#asOnDateDownloadForm' : null">
                                            Show Report
                                        </button>
                                        <a class="btn btn-primary ml-2" style="font-size: 16px;" target="_blank"
                                           th:href="@{/physicalProgressReports/as-on-date/pdf(asOnDate=${asOnDate}, component=${selectedComponent.name()})}">
                                            Download PDF
                                        </a>
                                    </div>
                                </div>
                            </form>

                            <div class="mt-2" style="font-size: 14px;">
                                <p class="mb-2">
                                    Data is available from
                                    <strong id="availableFrom" th:text="${minDate != null ? #temporals.format(minDate, 'dd-MM-yyyy') : '-'}"></strong>
                                    onwards.
                                </p>
                            </div>

                            <div class="mt-2" th:if="${reportReady}">
                                <h4 class="text-center font-weight-bold mb-2" style="font-size: 18px;"
                                    th:text="${selectedComponent.label + ' - As on ' + #temporals.format(asOnDate, 'dd-MM-yyyy')}"></h4>
                                <div th:replace="~{__${reportFragment}__ :: reportTable}"></div>
                            </div>
                            <style>
                                #asOnDateDisplay { cursor: pointer; }
                                #ui-datepicker-div .ui-datepicker-header { padding: 4px 28px; }
                                #ui-datepicker-div .ui-datepicker-prev,
                                #ui-datepicker-div .ui-datepicker-next {
                                    top: 6px; width: 22px; height: 22px; cursor: pointer;
                                    text-align: center; line-height: 22px; font-weight: bold;
                                }
                                #ui-datepicker-div .ui-datepicker-prev { left: 4px; }
                                #ui-datepicker-div .ui-datepicker-next { right: 4px; }
                                #ui-datepicker-div .ui-datepicker-prev .ui-icon,
                                #ui-datepicker-div .ui-datepicker-next .ui-icon { display: none; }
                                #ui-datepicker-div .ui-datepicker-prev:after { content: '\2039'; font-size: 20px; }
                                #ui-datepicker-div .ui-datepicker-next:after { content: '\203A'; font-size: 20px; }
                                #ui-datepicker-div .ui-state-disabled { opacity: 0.35; }
                                #ui-datepicker-div select { font-size: 13px; padding: 1px; }
                            </style>
                            <script th:inline="javascript">
                                window.asOnDateIsoParts = function (iso) {
                                    var p = (iso || '').split('-');
                                    if (p.length !== 3) {
                                        return null;
                                    }
                                    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
                                };
                                window.asOnDateFormatIso = function (date) {
                                    var month = String(date.getMonth() + 1);
                                    var day = String(date.getDate());
                                    if (month.length < 2) { month = '0' + month; }
                                    if (day.length < 2) { day = '0' + day; }
                                    return date.getFullYear() + '-' + month + '-' + day;
                                };
                                window.initAsOnDatePicker = function () {
                                    var display = document.getElementById('asOnDateDisplay');
                                    var hidden = document.getElementById('asOnDate');
                                    if (!display || !window.jQuery || !jQuery.ui || !jQuery.fn.datepicker) {
                                        return;
                                    }
                                    var minDate = window.asOnDateIsoParts(display.getAttribute('data-min'));
                                    var maxDate = window.asOnDateIsoParts(display.getAttribute('data-max'));
                                    var $display = jQuery(display);
                                    if ($display.hasClass('hasDatepicker')) {
                                        $display.datepicker('destroy');
                                    }
                                    $display.off('click.asOnDate');
                                    $display.datepicker({
                                        dateFormat: 'dd-mm-yy',
                                        minDate: minDate,
                                        maxDate: maxDate,
                                        changeMonth: true,
                                        changeYear: true,
                                        showAnim: '',
                                        yearRange: (minDate ? minDate.getFullYear() : 2024) + ':' + (maxDate ? maxDate.getFullYear() : new Date().getFullYear()),
                                        beforeShow: function (input, inst) {
                                            setTimeout(function () {
                                                inst.dpDiv.css('z-index', 2000);
                                            }, 0);
                                        },
                                        onSelect: function (text) {
                                            var parts = text.split('-');
                                            if (hidden && parts.length === 3) {
                                                hidden.value = parts[2] + '-' + parts[1] + '-' + parts[0];
                                            }
                                            display.blur();
                                        }
                                    });
                                    $display.on('click.asOnDate', function () {
                                        $display.datepicker('show');
                                    });
                                };
                                window.updateAsOnDateLimit = function (sel) {
                                    var minIso = sel.options[sel.selectedIndex].getAttribute('data-min');
                                    var display = document.getElementById('asOnDateDisplay');
                                    var hidden = document.getElementById('asOnDate');
                                    var label = document.getElementById('availableFrom');
                                    var minDate = window.asOnDateIsoParts(minIso);
                                    if (!minIso || !display || !minDate) {
                                        return;
                                    }
                                    display.setAttribute('data-min', minIso);
                                    if (label) {
                                        label.textContent = window.asOnDateFormatIso(minDate).split('-').reverse().join('-');
                                    }
                                    var $display = window.jQuery ? jQuery(display) : null;
                                    if ($display && $display.hasClass('hasDatepicker')) {
                                        $display.datepicker('option', 'minDate', minDate);
                                        $display.datepicker('option', 'yearRange', minDate.getFullYear() + ':' + (display.getAttribute('data-max') || '').substring(0, 4));
                                    }
                                    var current = hidden && hidden.value ? window.asOnDateIsoParts(hidden.value) : null;
                                    if (current && current < minDate) {
                                        if ($display && $display.hasClass('hasDatepicker')) {
                                            $display.datepicker('setDate', minDate);
                                        } else {
                                            display.value = window.asOnDateFormatIso(minDate).split('-').reverse().join('-');
                                        }
                                        if (hidden) {
                                            hidden.value = minIso;
                                        }
                                    }
                                };
                                if (document.readyState === 'loading') {
                                    document.addEventListener('DOMContentLoaded', window.initAsOnDatePicker);
                                } else {
                                    window.initAsOnDatePicker();
                                }
                            </script>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    </div>
</div>
</body>
</html>
