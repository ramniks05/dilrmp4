<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layouts/dashboard">

<head>
  <meta charset="UTF-8">
  <title>DILRMP-MIS-4.0</title>
  <style>
    body{background-color:#F9F9FC;font-family: 'Roboto', sans-serif;font-size:14px;}
        .table-bordered th, .table-bordered td {
    border: 1px solid #16aec6;
    }
    .table-bordered {
    border: 2px solid #16aec6;;
    }


 .modal__btn {
  padding: 1rem 1.6rem;
  border: 1px solid hsla(0, 0%, 100%, .4);
  border-radius: 100rem;

  color: inherit;
  background: transparent;


  letter-spacing: .2rem;

  transition: .2s;
  cursor: pointer;
}

.modal__btn:hover,
.modal__btn:focus {
  border-color: hsla(0, 0%, 100%, .6);
  transform: translateY(-.2rem);
}

.modal__details {
  text-align: center;

  margin-bottom: -1rem;
  padding-bottom: 4rem;
  border-bottom: 1px solid hsla(0, 0%, 100%, .4);
}

.link-2:hover,
.link-2:focus {
  border-color: hsla(0, 0%, 100%, .6);
  transform: translateY(-.2rem);
}

    .page-link {
    position: relative;
    display: block;
    padding: 0.5rem 0.75rem;
    margin-left: -1px;
    line-height: 1.25;
    color: #007bff;
    background-color: #fff;
    border: 1px solid var(--cyan);
}
.button-container>div a {
    margin-bottom: 10px;
    display: block;
}
#waitVillage {
	width: 100px;
	height: 130px;
	text-align: center;
	position: fixed;
	left: 280px;
	right: 0;
	top: 40%;
	z-index: 99;
	margin: 0 auto;
	background: rgba(255, 255, 255, 0.85);
	border-radius: 20px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.43);
	display: none;
}

#waitVillage img {
	width: 100%;
}
    .page-item.active .page-link {
    z-index: 3;
    color: #fff;
    background-color: var(--cyan);
    border-color: #438893;
}

#waitTeshsil {
	width: 100px;
	height: 130px;
	text-align: center;
	position: fixed;
	left: 280px;
	right: 0;
	top: 40%;
	z-index: 99;
	margin: 0 auto;
	background: rgba(255, 255, 255, 0.85);
	border-radius: 20px;
	box-shadow: 0 0 10px rgba(0, 0, 0, 0.43);
	display: none;
}

#waitTeshsil img {
	width: 100%;
}
    .page-item.active .page-link {
    z-index: 3;
    color: #fff;
    background-color: var(--cyan);
    border-color: #438893;
}



    </style>

  <style>

.section-title h2 {
  text-align: center;
  padding-bottom: 30px;
}

.section-title h2 {
  font-size: 18px;
  text-transform: uppercase;
  position: relative;
  color: #222222;
}

.section-title h2::before,
.section-title h2::after {
  content: "";
  width: 50px;
  height: 2px;
  background: #3498db;
  display: inline-block;
}

.section-title h2::before {
  margin: 0 15px 5px 0;
}

.section-title h2::after {
  margin: 0 0 5px 15px;
}
</style>

</head>

<div class="content-wrapper" layout:fragment="content" style="box-shadow: rgba(9, 30, 66, 0.25) 0px 4px 8px -2px, rgba(9, 30, 66, 0.08) 0px 0px 0px 1px;">
  <!-- Content Header (Page header) -->
  <section class="content">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-12">
          <div class="card card-info">
            <div class="card-header" style="background-color: #8ddfef; text-align: center; padding: 10px;">
              <div th:if="${flashMessage}" style="display: inline-block; background-color: #ffffff; padding: 10px 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
                <marquee scrollamount="10" style="font-family: Arial, sans-serif; font-size: 16px; color: red; font-weight: bold;">
                  <div th:if="${flashMessages != null}">
                    <h4 style="margin: 0; display: inline;" th:each="msg, iterStat : ${flashMessages}">
                      <span style="color: red;" th:text="${msg}"></span>
                      <span th:if="${!iterStat.last}" style="color: blue; padding: 0 5px;">|</span>
                    </h4>
                  </div>
                </marquee>
              </div>
              <div >
                <div class="col-sm-10">
                  <h3 class="card-title" style="font-size: 29px; font-family: auto; text-shadow: 2px 2px 4px #090a0a; letter-spacing: 2px;">District Master Summary</h3>
                </div>
              </div>
            </div>
            <div class="card-body">
              <div>
                <form>

                  <!-- Main content -->
                  <div class="content" >
                    <div class="row">


                      <!-- ./col -->
                      <div class="col-lg-3 col-6" >
                        <!-- small box -->
                        <div class="small-box bg-success" style="background-color: rgb(91 149 213) !important;" >
                          <div class="inner">
                            <h3 style="font-weight: bold; margin-right: 5px;"
                                th:text="${districtdashBoardList[0].totalTehsil != null ? districtdashBoardList[0].totalTehsil : 'N/A'}"></h3>
                            <p>Total <br>Tehsils</p>
                          </div>
                          <div class="icon">
                            <i class="ion ion-stats-bars"></i>
                          </div>
                        </div>
                      </div>
                      <div class="col-lg-1 col-6">
                      </div>
                      <div class="col-lg-3 col-6">
                        <!-- small box -->
                        <div class="small-box bg-info" style="background-color: rgb(28, 199, 164) !important;">

                          <div class="inner">
                            <h3 style="font-weight: bold; margin-right: 5px;"
                                th:text="${districtdashBoardList[0].totalVillage != null ? districtdashBoardList[0].totalVillage : 'N/A'}"></h3>
                            <p>Total<br> Villages</p>
                          </div>
                          <div class="icon">
                            <i class="ion ion-person-add"></i>
                          </div>
                        </div>
                      </div>
                      <div class="col-lg-1.5 col-6">
                      </div>
                      <hr>
                    </div>



                    <div class="row">
                      <div class="container-fluid">
                        <div>
                          <div class="section-title aos-init aos-animate" data-aos="fade-up">

                          </div><!-- /.col -->
                        </div><!-- /.row -->
                        <hr>
                      </div>


                      <div class="col-lg-3 col-6">

                        <!-- small box -->
                        <div class="small-box bg-info" style="background-color: rgb(40, 167, 69) !important;">
                          <div class="inner">
                            <h3 style="font-weight: bold; margin-right: 5px;"
                                th:text="${districtdashBoardList[0].villagesComputerizationCompleted != null ? districtdashBoardList[0].villagesComputerizationCompleted : 'N/A'}"></h3>
                            <p>Total <br>CLR Completed(Villages)</p>
                          </div>
                          <div class="icon">
                            <i class="fa-solid fa-file-import iconContent"></i>
                          </div>

                        </div>
                      </div>
                      <div class="col-lg-1 col-6">
                      </div>
                      <div class="col-lg-3 col-6">
                        <!-- small box -->
                        <div class="small-box bg-info" style="background-color: rgb(23, 162, 184) !important;">

                          <div class="inner">
                            <h3 style="font-weight: bold; margin-right: 5px;"
                                th:text="${districtdashBoardList[0].totalDigitizedMapsFmbTippans != null ? districtdashBoardList[0].totalDigitizedMapsFmbTippans : 'N/A'}"></h3>
                            <p>Total<br> Digitized Mapsheets</p>
                          </div>
                          <div class="icon">
                            <i class="fa-solid fa-map-location-dot iconContent"></i>
                          </div>

                        </div>
                      </div>
                      <div class="col-lg-1 col-6">
                      </div>
                      <div class="col-lg-3 col-6">
                        <!-- small box -->
                        <div class="small-box bg-info" style="background-color: rgb(0, 123, 255) !important;">

                          <div class="inner">
                            <h3 style="font-weight: bold; margin-right: 5px;"
                                th:text="${districtdashBoardList[0].villagesMap1Generated != null ? districtdashBoardList[0].villagesMap1Generated : 'N/A'}"></h3>
                            <p>Total <br>Surveyed Villages</p>
                          </div>
                          <div class="icon">
                            <i class="fa fa-camera-retro iconContent"></i>
                          </div>
                        </div>
                      </div>
                      <div class="col-lg-1 col-6">
                      </div>
                    </div>

                    <!-- 3rd Row Started -->
                    <div class="content" >

                      <div class="row">
                      </div>
                    </div>
                    <div class="row">
                      <div class="col-lg-3 col-6">
                        <!-- small box -->
                        <div class="small-box bg-info" style="background-color:#138d75 !important;">
                          <div class="inner">
                            <h3 style="font-weight: bold; margin-right: 5px;"
                                th:text="${districtdashBoardList[0].sroComputerized != null ? districtdashBoardList[0].sroComputerized : 'N/A'}"></h3>
                            <p>Total<br> SRO's Computerized</p>
                          </div>
                          <div class="icon">
                            <i class="fa-solid fa-laptop iconContent"></i>
                          </div>
                        </div>
                      </div>
                      <div class="col-lg-1 col-6">
                      </div>
                      <div class="col-lg-3 col-6">
                        <!-- small box -->
                        <div class="small-box bg-info" style="background-color: rgb(108, 117, 125) !important;">
                          <div class="inner">
                            <h3 style="font-weight: bold; margin-right: 5px;"
                                th:text="${districtdashBoardList[0].mrrCompleted != null ? districtdashBoardList[0].mrrCompleted : 'N/A'}"></h3>
                            <p>Total<br> MRR Completed</p>
                          </div>
                          <div class="icon">
                            <i class="fa-solid fa-location-pin iconContent"></i>
                          </div>
                        </div>
                      </div>

                      <div class="col-lg-1 col-6">
                      </div>

                      <div class="col-lg-3 col-6">
                        <!-- small box -->
                        <div class="small-box bg-info" style="background-color: rgb(241, 196, 15) !important;">

                          <div class="inner">
                            <h3 style="font-weight: bold; margin-right: 5px;"
                                th:text="${districtdashBoardList[0].villagesWithUlipn != null ? districtdashBoardList[0].villagesWithUlipn : 'N/A'}"></h3>
                            <p>Total<br> ULPIN Generated</p>
                          </div>
                          <div class="icon">
                            <i class="fa-solid fa-location-pin iconContent"></i>
                          </div>
                        </div>
                      </div>

                    </div>

                  </div>

                </form>


              </div>
            </div>
          </div>
        </div>
      </div>
    </div>



  </section>
</div>
</html>
