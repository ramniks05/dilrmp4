<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layouts/dashboard">
<head>
    <meta charset="UTF-8">
    <title>Physical Progress Reports - As on Date</title>
    <link th:href="@{/css/report/report.css}" rel="stylesheet"/>
</head>
<body>
<div class="content-wrapper" layout:fragment="content"
     style="box-shadow: rgba(9, 30, 66, 0.25) 0px 4px 8px -2px, rgba(9, 30, 66, 0.08) 0px 0px 0px 1px;">
    <div th:fragment="asOnDateReportDownload">
    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-12">
                    <div class="card card-info">
                        <div class="card-header">
                            <h3 class="card-title"
                                style="font-size: 1.125rem">
                                Physical Progress Reports (State Level) - As on Date
                            </h3>
                        </div>
                        <div class="card-body">
                            <a th:unless="${embedded}" th:href="@{/reports/physical-progress-report}" class="btn btn-primary" style="font-size: 13px;">
                                ← Back
                            </a>

                            <div th:if="${error != null}" class="alert alert-danger mt-3" role="alert" th:text="${error}"></div>

                            <form th:action="@{/physicalProgressReports/as-on-date}" method="get" class="mt-3" id="asOnDateDownloadForm">
                                <div class="form-row align-items-end">
                                    <div class="col-md-4 mb-2">
                                        <label for="component">Select Component:</label>
                                        <select id="component" name="component" class="form-control" required
                                                onchange="if (window.updateAsOnDateLimit) { updateAsOnDateLimit(this); }">
                                            <option th:each="c : ${components}" th:value="${c.name()}" th:text="${c.label}"
                                                    th:attr="data-min=${componentMinDates[c.name()]}"
                                                    th:selected="${selectedComponent == c}"></option>
                                        </select>
                                    </div>
                                    <div class="col-md-3 mb-2">
                                        <label for="asOnDateDisplay">Select Date (As on):</label>
                                        <input type="text" id="asOnDateDisplay" class="form-control" required readonly
                                               autocomplete="off" placeholder="dd-mm-yyyy"
                                               style="background-color: #fff;"
                                               th:value="${asOnDate != null ? #temporals.format(asOnDate, 'dd-MM-yyyy') : ''}"
                                               th:attr="data-min=${minDate != null ? #temporals.format(minDate, 'yyyy-MM-dd') : ''}, data-max=${maxDate != null ? #temporals.format(maxDate, 'yyyy-MM-dd') : ''}">
                                        <input type="hidden" id="asOnDate" name="asOnDate"
                                               th:value="${asOnDate != null ? #temporals.format(asOnDate, 'yyyy-MM-dd') : ''}">
                                    </div>
                                    <div class="col-md-4 mb-2">
                                        <button type="submit" class="btn btn-primary" style="font-size: 16px;"
                                                th:attr="hx-get=${embedded} ? @{/dolr/physical-progress-as-on-date} : null,
                                                         hx-target=${embedded} ? '#content' : null,
                                                         hx-swap=${embedded} ? 'innerHTML' : null,
                                                         hx-include=${embedded} ? '#asOnDateDownloadForm' : null">
                                            Show Report
                                        </button>
                                        <a class="btn btn-primary ml-2" style="font-size: 16px;" target="_blank"
                                           th:href="@{/physicalProgressReports/as-on-date/pdf(asOnDate=${asOnDate}, component=${selectedComponent.name()})}">
                                            Download PDF
                                        </a>
                                        <button type="button" class="btn btn-success ml-2" id="downloadAllZip" style="font-size: 16px;"
                                                th:attr="data-base=@{/physicalProgressReports/as-on-date/zip}">
                                            Download All (ZIP)
                                        </button>
                                    </div>
                                </div>
                            </form>

                            <div class="mt-2" style="font-size: 14px;">
                                <p class="mb-2">
                                    Data is available from
                                    <strong id="availableFrom" th:text="${minDate != null ? #temporals.format(minDate, 'dd-MM-yyyy') : '-'}"></strong>
                                    onwards.
                                    Download All (ZIP) saves every component report for the selected date in one file.
                                </p>
                            </div>

                            <div class="mt-2" id="asOnDateReport" th:if="${reportReady}">
                                <h4 class="text-center font-weight-bold mb-2" style="font-size: 18px;"
                                    th:text="${selectedComponent.label + ' - As on ' + #temporals.format(asOnDate, 'dd-MM-yyyy')}"></h4>
                                <div th:replace="~{__${reportFragment}__ :: reportTable}"></div>
                            </div>
                            <style>
                                #asOnDateDisplay { cursor: pointer; }
                                #ui-datepicker-div .ui-datepicker-header { padding: 4px 28px; }
                                #ui-datepicker-div .ui-datepicker-prev,
                                #ui-datepicker-div .ui-datepicker-next {
                                    top: 6px; width: 22px; height: 22px; cursor: pointer;
                                    text-align: center; line-height: 22px; font-weight: bold;
                                }
                                #ui-datepicker-div .ui-datepicker-prev { left: 4px; }
                                #ui-datepicker-div .ui-datepicker-next { right: 4px; }
                                #ui-datepicker-div .ui-datepicker-prev .ui-icon,
                                #ui-datepicker-div .ui-datepicker-next .ui-icon { display: none; }
                                #ui-datepicker-div .ui-datepicker-prev:after { content: '\2039'; font-size: 20px; }
                                #ui-datepicker-div .ui-datepicker-next:after { content: '\203A'; font-size: 20px; }
                                #ui-datepicker-div .ui-state-disabled { opacity: 0.35; }
                                #ui-datepicker-div select { font-size: 13px; padding: 1px; }
                                #asOnDateReport .table-responsive {
                                    max-height: calc(100vh - 230px);
                                    overflow: auto;
                                    position: relative;
                                }
                                #asOnDateReport table {
                                    border-collapse: separate !important;
                                    border-spacing: 0;
                                    margin-bottom: 0;
                                }
                                #asOnDateReport .as-on-sticky-head {
                                    position: sticky;
                                    z-index: 3;
                                }
                                #asOnDateReport .as-on-sticky-col {
                                    position: sticky;
                                    z-index: 2;
                                }
                                #asOnDateReport thead .as-on-sticky-col {
                                    z-index: 5;
                                }
                                #asOnDateReport .as-on-col-edge {
                                    box-shadow: 2px 0 4px rgba(0, 0, 0, 0.12);
                                }
                                #asOnDateReport thead tr:last-child > .as-on-sticky-head {
                                    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
                                }
                                #asOnDateReport thead tr:last-child > .as-on-sticky-head.as-on-col-edge {
                                    box-shadow: 2px 0 4px rgba(0, 0, 0, 0.12), 0 2px 0 rgba(0, 0, 0, 0.18);
                                }
                            </style>
                            <script th:inline="javascript">
                                window.asOnDateIsoParts = function (iso) {
                                    var p = (iso || '').split('-');
                                    if (p.length !== 3) {
                                        return null;
                                    }
                                    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
                                };
                                window.asOnDateFormatIso = function (date) {
                                    var month = String(date.getMonth() + 1);
                                    var day = String(date.getDate());
                                    if (month.length < 2) { month = '0' + month; }
                                    if (day.length < 2) { day = '0' + day; }
                                    return date.getFullYear() + '-' + month + '-' + day;
                                };
                                window.initAsOnDatePicker = function () {
                                    var display = document.getElementById('asOnDateDisplay');
                                    var hidden = document.getElementById('asOnDate');
                                    if (!display || !window.jQuery || !jQuery.ui || !jQuery.fn.datepicker) {
                                        return;
                                    }
                                    var minDate = window.asOnDateIsoParts(display.getAttribute('data-min'));
                                    var maxDate = window.asOnDateIsoParts(display.getAttribute('data-max'));
                                    var $display = jQuery(display);
                                    if ($display.hasClass('hasDatepicker')) {
                                        $display.datepicker('destroy');
                                    }
                                    $display.off('click.asOnDate');
                                    $display.datepicker({
                                        dateFormat: 'dd-mm-yy',
                                        minDate: minDate,
                                        maxDate: maxDate,
                                        changeMonth: true,
                                        changeYear: true,
                                        showAnim: '',
                                        yearRange: (minDate ? minDate.getFullYear() : 2024) + ':' + (maxDate ? maxDate.getFullYear() : new Date().getFullYear()),
                                        beforeShow: function (input, inst) {
                                            setTimeout(function () {
                                                inst.dpDiv.css('z-index', 2000);
                                            }, 0);
                                        },
                                        onSelect: function (text) {
                                            var parts = text.split('-');
                                            if (hidden && parts.length === 3) {
                                                hidden.value = parts[2] + '-' + parts[1] + '-' + parts[0];
                                            }
                                            display.blur();
                                        }
                                    });
                                    $display.on('click.asOnDate', function () {
                                        $display.datepicker('show');
                                    });
                                };
                                window.downloadAsOnDateZip = function () {
                                    var button = document.getElementById('downloadAllZip');
                                    var hidden = document.getElementById('asOnDate');
                                    var iso = hidden ? hidden.value : '';
                                    if (!button || !iso) {
                                        window.alert('Select a date first.');
                                        return;
                                    }
                                    var base = button.getAttribute('data-base');
                                    var url = base + '?asOnDate=' + encodeURIComponent(iso);
                                    var link = document.createElement('a');
                                    link.href = url;
                                    link.style.display = 'none';
                                    document.body.appendChild(link);
                                    link.click();
                                    link.remove();
                                };
                                var zipButton = document.getElementById('downloadAllZip');
                                if (zipButton) {
                                    zipButton.onclick = function () {
                                        window.downloadAsOnDateZip();
                                    };
                                };
                                window.updateAsOnDateLimit = function (sel) {
                                    var minIso = sel.options[sel.selectedIndex].getAttribute('data-min');
                                    var display = document.getElementById('asOnDateDisplay');
                                    var hidden = document.getElementById('asOnDate');
                                    var label = document.getElementById('availableFrom');
                                    var minDate = window.asOnDateIsoParts(minIso);
                                    if (!minIso || !display || !minDate) {
                                        return;
                                    }
                                    display.setAttribute('data-min', minIso);
                                    if (label) {
                                        label.textContent = window.asOnDateFormatIso(minDate).split('-').reverse().join('-');
                                    }
                                    var $display = window.jQuery ? jQuery(display) : null;
                                    if ($display && $display.hasClass('hasDatepicker')) {
                                        $display.datepicker('option', 'minDate', minDate);
                                        $display.datepicker('option', 'yearRange', minDate.getFullYear() + ':' + (display.getAttribute('data-max') || '').substring(0, 4));
                                    }
                                    var current = hidden && hidden.value ? window.asOnDateIsoParts(hidden.value) : null;
                                    if (current && current < minDate) {
                                        if ($display && $display.hasClass('hasDatepicker')) {
                                            $display.datepicker('setDate', minDate);
                                        } else {
                                            display.value = window.asOnDateFormatIso(minDate).split('-').reverse().join('-');
                                        }
                                        if (hidden) {
                                            hidden.value = minIso;
                                        }
                                    }
                                };
                                window.freezeAsOnDateReport = function () {
                                    var root = document.getElementById('asOnDateReport');
                                    if (!root) {
                                        return;
                                    }
                                    var table = root.querySelector('table');
                                    var wrap = root.querySelector('.table-responsive');
                                    if (!table || !wrap) {
                                        return;
                                    }
                                    table.classList.remove('table-responsive');
                                    var headRows = [];
                                    var theads = table.querySelectorAll('thead');
                                    for (var t = 0; t < theads.length; t++) {
                                        var rows = theads[t].children;
                                        for (var r = 0; r < rows.length; r++) {
                                            if (rows[r].tagName === 'TR') {
                                                headRows.push(rows[r]);
                                            }
                                        }
                                    }
                                    var grid = [];
                                    headRows.forEach(function (tr, rowIndex) {
                                        var col = 0;
                                        var cells = tr.children;
                                        for (var i = 0; i < cells.length; i++) {
                                            var cell = cells[i];
                                            if (!grid[rowIndex]) {
                                                grid[rowIndex] = [];
                                            }
                                            while (grid[rowIndex][col]) {
                                                col++;
                                            }
                                            var colSpan = cell.colSpan || 1;
                                            var rowSpan = cell.rowSpan || 1;
                                            cell.setAttribute('data-col-start', String(col));
                                            for (var rr = 0; rr < rowSpan; rr++) {
                                                if (!grid[rowIndex + rr]) {
                                                    grid[rowIndex + rr] = [];
                                                }
                                                for (var cc = 0; cc < colSpan; cc++) {
                                                    grid[rowIndex + rr][col + cc] = cell;
                                                }
                                            }
                                            col += colSpan;
                                        }
                                    });
                                    var headerCells = table.querySelectorAll('thead th, thead td');
                                    var headBg = '#4a6c52';
                                    if (headerCells.length) {
                                        var painted = window.getComputedStyle(headerCells[0]).backgroundColor;
                                        if (!window.asOnDateClearColor(painted)) {
                                            headBg = painted;
                                        }
                                    }
                                    for (var h = 0; h < headerCells.length; h++) {
                                        headerCells[h].style.top = '';
                                        headerCells[h].style.left = '';
                                        headerCells[h].classList.add('as-on-sticky-head');
                                    }
                                    var bodyCells = table.querySelectorAll('tbody > tr > td, tfoot > tr > td');
                                    var freezeCells = [];
                                    function rememberFreezeCell(cell) {
                                        var start = cell.getAttribute('data-col-start');
                                        if (start === null && cell.parentElement) {
                                            start = String(Array.prototype.indexOf.call(cell.parentElement.children, cell));
                                            cell.setAttribute('data-col-start', start);
                                        }
                                        if ((start !== '0' && start !== '1') || (cell.colSpan || 1) !== 1) {
                                            return;
                                        }
                                        cell.classList.add('as-on-sticky-col');
                                        cell.style.minWidth = start === '0' ? '56px' : '150px';
                                        if (start === '1') {
                                            cell.classList.add('as-on-col-edge');
                                        }
                                        freezeCells.push(cell);
                                    }
                                    for (var hc = 0; hc < headerCells.length; hc++) {
                                        rememberFreezeCell(headerCells[hc]);
                                    }
                                    for (var bc = 0; bc < bodyCells.length; bc++) {
                                        rememberFreezeCell(bodyCells[bc]);
                                    }
                                    var top = 0;
                                    headRows.forEach(function (tr) {
                                        var band = window.asOnDateRowBand(tr);
                                        var cells = tr.children;
                                        for (var i = 0; i < cells.length; i++) {
                                            cells[i].style.top = top + 'px';
                                            window.asOnDateFillBackground(cells[i], headBg);
                                        }
                                        top += band;
                                    });
                                    var col0 = table.querySelector('[data-col-start="0"]');
                                    var firstWidth = col0 ? col0.getBoundingClientRect().width : 0;
                                    for (var s = 0; s < freezeCells.length; s++) {
                                        var item = freezeCells[s];
                                        var start = item.getAttribute('data-col-start');
                                        item.style.left = start === '0' ? '0px' : firstWidth + 'px';
                                        var inBody = item.parentElement && item.parentElement.parentElement
                                            && item.parentElement.parentElement.tagName !== 'THEAD';
                                        window.asOnDateFillBackground(item, inBody ? '#ffffff' : headBg);
                                    }
                                };
                                window.asOnDateRowBand = function (tr) {
                                    var height = 0;
                                    var cells = tr.children;
                                    for (var i = 0; i < cells.length; i++) {
                                        if ((cells[i].rowSpan || 1) !== 1) {
                                            continue;
                                        }
                                        var band = cells[i].getBoundingClientRect().height;
                                        if (band > 0 && (height === 0 || band < height)) {
                                            height = band;
                                        }
                                    }
                                    if (!height) {
                                        height = tr.getBoundingClientRect().height;
                                    }
                                    return height;
                                };
                                window.asOnDateFillBackground = function (cell, fallback) {
                                    var bg = window.getComputedStyle(cell).backgroundColor;
                                    if (window.asOnDateClearColor(bg) && cell.parentElement) {
                                        bg = window.getComputedStyle(cell.parentElement).backgroundColor;
                                    }
                                    if (window.asOnDateClearColor(bg)) {
                                        bg = fallback;
                                    }
                                    cell.style.backgroundColor = bg;
                                };
                                window.asOnDateClearColor = function (color) {
                                    return !color || color === 'transparent' || color === 'rgba(0, 0, 0, 0)';
                                };
                                window.scheduleAsOnDateFreeze = function () {
                                    window.freezeAsOnDateReport();
                                    window.requestAnimationFrame(function () {
                                        window.freezeAsOnDateReport();
                                    });
                                };
                                if (document.readyState === 'loading') {
                                    document.addEventListener('DOMContentLoaded', function () {
                                        window.initAsOnDatePicker();
                                        window.scheduleAsOnDateFreeze();
                                    });
                                } else {
                                    window.initAsOnDatePicker();
                                    window.scheduleAsOnDateFreeze();
                                }
                                if (window._asOnDateFreezeResize) {
                                    window.removeEventListener('resize', window._asOnDateFreezeResize);
                                }
                                window._asOnDateFreezeResize = function () {
                                    window.scheduleAsOnDateFreeze();
                                };
                                window.addEventListener('resize', window._asOnDateFreezeResize);
                                if (!window._asOnDateFreezeHtmx) {
                                    window._asOnDateFreezeHtmx = true;
                                    document.body.addEventListener('htmx:afterSettle', function (evt) {
                                        var target = evt.detail && evt.detail.target;
                                        if (!target || !window.scheduleAsOnDateFreeze) {
                                            return;
                                        }
                                        if (target.id === 'content' || (target.querySelector && target.querySelector('#asOnDateReport'))) {
                                            if (document.getElementById('asOnDateReport')) {
                                                window.scheduleAsOnDateFreeze();
                                            }
                                        }
                                    });
                                }
                            </script>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    </div>
</div>
</body>
</html>
