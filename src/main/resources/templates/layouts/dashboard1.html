<head>

    <title>DILRMP MIS</title>
    <!-- Google Font: Source Sans Pro -->
    <!-- jQuery -->
    <script th:src="@{/static/js/jquery.min.js}"></script>
    <script th:src="@{/static/js/jquery.min.js}"></script>
    <script th:src="@{/static/plugins/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <link rel="stylesheet" th:href="@{/static/css/all.min-1.css}">
    <link rel="stylesheet"  th:href="@{/static/css/choice.min.css.css}">

    <link rel="stylesheet" th:href="@{/static/css/dataTables.bootstrap4.min.css}">

    <link rel="stylesheet" th:href="@{/static/css/adminlte.css}">
    <script src="https://unpkg.com/htmx.org@1.9.2"></script>

<body class="hold-transition sidebar-mini">

<span th:replace="~{fragments/top-header :: top-header}"></span>

<!-- Bootstrap 4 -->
<script th:src="@{/static/js/bootstrap.min.js}"></script>
