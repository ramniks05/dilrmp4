  <script>
    // Function to handle the click event for any link in the boxes
    function handleLinkClick(linkNumber, event) {
        // Construct the ID of the corresponding loading spinner
        var waitId = "#wait" + linkNumber;

        // Show the loading spinner
        $(waitId).css("display", "block");

        // Hide the clicked link
        $("#link" + linkNumber).css("display", "none");

        // Optional: You can do additional actions or customization here

        // Delay for a short time (e.g., 500 milliseconds) to display the loading spinner
        setTimeout(function () {
            // Navigate to the link destination
            window.location.href = $("#link" + linkNumber).attr("href");
        }, 500);

        // Prevent the default behavior of the link immediately (to show the loading spinner)
        event.preventDefault();
    }

    // Attach the handleLinkClick function to the click event of each link in the boxes
    $("#linkOne").click(function (event) { handleLinkClick("One", event); });
    $("#linkTwo").click(function (event) { handleLinkClick("Two", event); });
    $("#linkThree").click(function (event) { handleLinkClick("Three", event); });
    $("#linkFour").click(function (event) { handleLinkClick("Four", event); });
    $("#linkFive").click(function (event) { handleLinkClick("Five", event); });
</script>
