<div th:fragment="unspent-balance-report">
    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-12">
                    <div class="card card-info">
                        <div class="card-header" style="background: linear-gradient(to right, #32b4c8 0%, rgb(64 101 142));">
                            <div class="row">
                                <div class="col-sm-10">
                                    <h3 class="card-title" style="color: #eff3f6; font-size: 24px; font-family: auto; text-shadow: 2px 2px 4px #090a0a; letter-spacing: 2px;">
                                        Unspent Balance Report
                                    </h3>
                                </div>
                                <div class="col-sm-2 text-right">
                                    <a href="#" onclick="return ubDownload('pdf')" title="Download PDF">
                                        <img th:src="@{/images/pdf.png}" alt="PDF" class="btn-img" width="40" height="40"/>
                                    </a>
                                    <a href="#" onclick="return ubDownload('excel')" title="Download Excel">
                                        <img th:src="@{/images/excel.png}" alt="Excel" class="btn-img" width="40" height="40"/>
                                    </a>
                                </div>
                            </div>
                        </div>
                        <div class="card-body">
                            <form id="ubReportFilter"
                                  hx-post="/dolr/unspent-balance/report/load"
                                  hx-target="#ubReportWrap"
                                  hx-indicator="#ubReportLoading">
                                <div class="table-responsive mb-3">
                                    <table class="table table-bordered ub-filter-table mb-0">
                                        <tbody>
                                        <tr>
                                            <td class="ub-filter-label"><strong>STATE / UT :</strong></td>
                                            <td class="ub-filter-value">
                                                <select id="ubReportState" name="stateId" class="form-control form-control-sm ub-filter-select" required>
                                                    <option value="">-- Select State / UT --</option>
                                                    <option th:each="state : ${states}"
                                                            th:value="${state.id}"
                                                            th:text="${state.name}">
                                                    </option>
                                                </select>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td colspan="2" class="text-center">
                                                <button type="submit" class="btn btn-primary btn-sm">
                                                    <i class="fas fa-search"></i> View Report
                                                </button>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </form>

                            <div id="ubReportLoading" class="htmx-indicator text-muted mb-2">
                                <i class="fas fa-spinner fa-spin"></i> Loading report...
                            </div>

                            <div id="ubReportWrap">
                                <div class="alert alert-light border">Select a State / UT and click <strong>View Report</strong>.</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator { display: inline-block; }

        .ub-filter-table { max-width: 520px; background-color: #d9ead3; }
        .ub-filter-table td { vertical-align: middle; border-color: #b6d7a8 !important; padding: 8px 12px; }
        .ub-filter-label { width: 45%; white-space: nowrap; }
        .ub-filter-value { width: 55%; }
        .ub-filter-select { background-color: #fff; border: 1px solid #93c47d; font-weight: 600; }

        #ubReportTable { margin-bottom: 0; }
        #ubReportTable thead th { background-color: #cfe2f3; color: #1a1d26; text-align: center; vertical-align: middle; font-size: 13px; border-color: #9fc5e8 !important; }
        #ubReportTable td { vertical-align: middle; font-size: 13px; }
        #ubReportTable .ub-col-sn { width: 7%; text-align: center; white-space: nowrap; }
        #ubReportTable .ub-col-amount { width: 28%; text-align: right; }
        #ubReportTable .ub-row-group td { background-color: #d9ead3; font-weight: 700; }
        #ubReportTable .ub-row-subtotal td { background-color: #f2f2f2; font-weight: 700; }
        #ubReportTable .ub-row-parent td { font-weight: 700; }
        #ubReportTable .ub-row-sub .ub-col-component { padding-left: 32px; }
        #ubReportTable .ub-row-total td { background-color: #fff2cc; font-weight: 700; }
    </style>

    <script>
        function ubDownload(type) {
            var stateId = document.getElementById('ubReportState').value;
            if (!stateId) {
                alert('Please select State / UT to download the report.');
                return false;
            }
            window.location.href = '/dolr/unspent-balance/report/' + type + '?stateId=' + encodeURIComponent(stateId);
            return false;
        }
    </script>
</div>

<div th:fragment="unspent-balance-report-table">
    <div th:if="${reportError != null}" class="alert alert-danger" th:text="${reportError}"></div>

    <th:block th:if="${reportError == null}">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-2">
            <div>
                <h5 class="mb-1">
                    <span th:text="${reportTitle}"></span> &ndash; <span th:text="${stateName}"></span>
                </h5>
                <small class="text-muted">Last updated by State: <span th:text="${lastUpdatedOn}"></span></small>
            </div>
            <div class="mt-2 mt-md-0">
                <a class="btn btn-danger btn-sm" th:href="@{/dolr/unspent-balance/report/pdf(stateId=${stateId})}">
                    <i class="fas fa-file-pdf"></i> Download PDF
                </a>
                <a class="btn btn-success btn-sm" th:href="@{/dolr/unspent-balance/report/excel(stateId=${stateId})}">
                    <i class="fas fa-file-excel"></i> Download Excel
                </a>
            </div>
        </div>

        <div th:if="${!submitted}" class="alert alert-warning py-2">
            The selected State / UT has not submitted the unspent balance yet.
        </div>

        <div class="table-responsive">
            <table class="table table-bordered" id="ubReportTable">
                <thead>
                <tr>
                    <th class="ub-col-sn">S. No.</th>
                    <th>Component</th>
                    <th th:text="${amountHeader}">Unspent Balance</th>
                </tr>
                </thead>
                <tbody>
                <th:block th:each="row : ${rows}">
                    <tr th:if="${row.group}" class="ub-row-group">
                        <td class="ub-col-sn" th:text="${row.serialNo}"></td>
                        <td colspan="2" th:text="${row.label}"></td>
                    </tr>
                    <tr th:if="${row.total}" th:class="${row.rowType == 'TOTAL'} ? 'ub-row-total' : 'ub-row-subtotal'">
                        <td></td>
                        <td class="text-right" th:text="${row.label}"></td>
                        <td class="ub-col-amount" th:text="${row.amountText}"></td>
                    </tr>
                    <tr th:if="${row.editable or row.rowType == 'PARENT'}"
                        th:class="${row.rowType == 'PARENT'} ? 'ub-row-parent' : (${row.rowType == 'SUB_ITEM'} ? 'ub-row-sub' : '')">
                        <td class="ub-col-sn" th:text="${row.serialNo}"></td>
                        <td class="ub-col-component" th:text="${row.label}"></td>
                        <td class="ub-col-amount" th:text="${row.amountText}"></td>
                    </tr>
                </th:block>
                </tbody>
            </table>
        </div>
        <p class="text-muted mt-2 mb-0">
            <small>Reference: <span th:text="${letterReference}"></span>. <span th:text="${componentNote}"></span></small>
        </p>
    </th:block>
</div>
