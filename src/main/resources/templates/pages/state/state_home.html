    <style>
        .count {
            font-size: 36px;
            font-weight: bold;
            color: blue;
        }
        .bg-info {
    background-color: #32b4c8 !important;
}
    </style>
    <script>
        $(document).ready(function() {
            var countElement = $('#count');
            var count = parseInt(countElement.text());
            var countNum = 0;

            $({ countNum: countElement.text() }).animate({ countNum: count }, {
                duration: 20000,
                easing: 'linear',
                step: function() {
                    countElement.text(Math.floor(this.countNum));
                },
                complete: function() {
                    countElement.text(Math.floor(this.countNum));
                }
            });
        });
    </script>
