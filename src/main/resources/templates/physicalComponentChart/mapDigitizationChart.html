<!DOCTYPE HTML>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Charts-Map Digitization</title>

    <style type="text/css">
        .highcharts-figure,
        .highcharts-data-table table {
            min-width: 360px;
            max-width: 800px;
            margin: 1em auto;
        }

        .highcharts-data-table table {
            font-family: Verdana, sans-serif;
            border-collapse: collapse;
            border: 1px solid #ebebeb;
            margin: 10px auto;
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        .highcharts-data-table caption {
            padding: 1em 0;
            font-size: 1.2em;
            color: #555;
        }

        .highcharts-data-table th {
            font-weight: 600;
            padding: 0.5em;
        }

        .highcharts-data-table td,
        .highcharts-data-table th,
        .highcharts-data-table caption {
            padding: 0.5em;
        }

        .highcharts-data-table thead tr,
        .highcharts-data-table tr:nth-child(even) {
            background: #f8f8f8;
        }

        .highcharts-data-table tr:hover {
            background: #f1f7ff;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script th:src="@{/static/chart-js/highcharts.js}"></script>
    <script th:src="@{/static/chart-js/series-label.js}"></script>
    <script th:src="@{/static/chart-js/exporting.js}"></script>
    <script th:src="@{/static/chart-js/export-data.js}"></script>
    <script th:src="@{/static/chart-js/accessibility.js}"></script>
</head>

<body>


    <figure class="highcharts-figure">
        <div id="container"></div>

        </br></br>
        <div id="container-column"></div>
    </figure>

    <script>
        $(document).ready(function () {
            $.ajax({
                type: 'POST',
                crossDomain: true,
                dataType: 'json',
                 url: '/api/chart/category=301',
                success: function (result) {
                    console.log(result.clrYearWiseData)
                    var nums = result.clrYearWiseData.map(function (str) {
                        return parseInt(str);
                    });
                    var month = result.clrYear.map(function (str) {
                        console.log(month);
                        return (str);
                    });

                    Highcharts.chart('container', {

                        title: {
                            text: 'Progress Report of Map Digitization Month wise'
                        },

                        subtitle: {
                            text: 'Source: <a href="https://dilrmp.gov.in" target="_blank">DILRMP</a>'
                        },

                        yAxis: {
                            title: {
                                text: 'Number of Digitized Mapsheets/FMBs/Tippans'
                            }
                        },

                        xAxis: {
                            categories:month,
                            accessibility: {
                                description: 'Months of the year'
                            }
                        },  

                        legend: {
                            layout: 'vertical',
                            align: 'right',
                            verticalAlign: 'middle'
                        },

                      

                        series: [{
                            name: 'Progress Report of Map/Fmbs/Tippans Digitization',
                            data: nums
                        }],

                        responsive: {
                            rules: [{
                                condition: {
                                    maxWidth: 500
                                },
                                chartOptions: {
                                    legend: {
                                        layout: 'horizontal',
                                        align: 'center',
                                        verticalAlign: 'bottom'
                                    }
                                }
                            }]
                        }

                    });
                    var nums1 = result.chartvalue.map(function (str) {
                        return parseInt(str);
                    });
                    Highcharts.chart('container-column', {
                        chart: {
                            type: 'column'
                        },
                        title: {
                            text: 'Progress Report of Map/Fmbs/Tippans Digitization (Current Status)'
                        },
                        subtitle: {
                            text: 'Source: <a href="https://dilrmp.gov.in/" target="_blank">DILRMP</a>'

                        },
                        xAxis: {
                            categories: result.categories,
                            crosshair: true
                        },
                        yAxis: {
                            title: {
                                useHTML: true,
                                text: 'Percentage(%)'

                            },
                            max: 100
                        },

                        tooltip: {
                            headerFormat: '<span style="font-size:10px">{point.key}</span><table>',
                            pointFormat: '<tr><td style="color:{series.color};padding:0">{series.name}: </td>' +
                                '<td style="padding:0"><b>{point.y:.1f}</b></td></tr>',
                            footerFormat: '</table>',
                            shared: true,
                            useHTML: true
                        },
                        plotOptions: {
                            column: {
                                pointPadding: 0.2,
                                borderWidth: 0,
                                colorByPoint: true
                            }
                        },
                        series: [{
                            name: 'Digitized Mapsheets/FMBs/Tippans(in %)',
                            data: nums1
                           


                        }]
                    });
                }
            });
        });

    </script>

</body>

</html>
