<div th:fragment="state-all-kpi"
     style="box-shadow: rgba(9, 30, 66, 0.25) 0px 4px 8px -2px, rgba(9, 30, 66, 0.08) 0px 0px 0px 1px;">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <div class="card card-info">
                    <div class="card-header">
                        <div class="row">
                            <div class="col-sm-10">
                                <h3 class="card-title"
                                    style="font-size: 24px; font-family: auto; text-shadow: 2px 2px 4px #090a0a; letter-spacing: 2px;">
                                    <span th:text="${labels['statereportName']}"></span>
                                </h3>
                            </div>
                            <div class="col-sm-2">
                                <a th:href="@{/physcial/report/pdf/all-kpi}">
                                    <img th:src="@{/images/pdf.png}" alt="PDF Icon" class="btn-img" width="40"
                                         height="40"
                                         style="box-shadow: rgba(0, 0, 0, 0.25) 0px 0.0625em 0.0625em, rgba(0, 0, 0, 0.25) 0px 0.125em 0.5em, rgba(255, 255, 255, 0.1) 0px 0px 0px 1px inset;"/>
                                </a>
                                <!--                                    <a th:href="@{/physcial/report/excel/clr}">-->
                                <!--                                        <img th:src="@{/images/excel.png}" alt="EXCEL Icon" class="btn-img"  width="40" height="40"-->
                                <!--                                             style="box-shadow: rgba(0, 0, 0, 0.25) 0px 0.0625em 0.0625em, rgba(0, 0, 0, 0.25) 0px 0.125em 0.5em, rgba(255, 255, 255, 0.1) 0px 0px 0px 1px inset;"/>-->
                                <!--                                    </a>-->
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <style>
        body {
            background-color: #F9F9FC;
            font-family: 'Roboto', sans-serif;
            font-size: 14px;
        }

        .table-bordered th,
        .table-bordered td {
            border: 1px solid #16aec6;
        }

        .table-bordered {
            border: 2px solid #16aec6;
            ;
        }

        .hidden-column {
            display: none;
        }

        .checkbox-container {
            display: flex;
            flex-wrap: wrap;
        }

        .column {
            box-sizing: border-box;
            padding: 0 10px;
            flex: 1 0 33.33%;
        }

        .col-3 {
            margin-top: 10px;
            flex: 1 0 25%;
        }

                        </style>
                        <div class="table-responsive text-nowrap">
                            <table id="example2" class="table table-bordered table-striped">
                                <thead class="card-info" style="background-color: #91c9d2;">
                                <tr>
                                    <th rowspan="3" th:text="${labels['serialNumber']}"></th>
                                    <th rowspan="3" th:text="${labels['stateUT']}"></th>
                                    <th rowspan="3" th:text="${labels['totalDistricts']}"></th>
                                    <th rowspan="3" th:text="${labels['totalTehsils']}"></th>
                                    <th rowspan="3" th:text="${labels['totalVillages']}"></th>
                                    <th colspan="2" rowspan="2" th:text="${labels['villageWhereCLRComplted']}"></th>
                                    <th colspan="3" rowspan="2" th:text="${labels['noOfCadastralMapsFmBsTippans']}"></th>
                                    <th colspan="2" rowspan="2" th:text="${labels['villageWhereCadatralMapLinkToROR']}"></th>
                                    <th colspan="5" th:text="${labels['numberOfSRO']}"></th>
                                </tr>
                                <tr>
                                    <th rowspan="2" th:text="${labels['total']}"></th>
                                    <th colspan="2" th:text="${labels['computerizedsros']}"></th>
                                    <th colspan="2" th:text="${labels['sroIntegratedWithLandRecords']}"></th>
                                </tr>
                                <tr>
                                    <th th:text="${labels['number']}"></th>
                                    <th th:text="${labels['percentage']}"></th>
                                    <th th:text="${labels['total']}"></th>
                                    <th th:text="${labels['digitized']}"></th>
                                    <th th:text="${labels['percentage']}"></th>
                                    <th th:text="${labels['number']}"></th>
                                    <th th:text="${labels['percentage']}"></th>
                                    <th th:text="${labels['number']}"></th>
                                    <th th:text="${labels['percentage']}"></th>
                                    <th th:text="${labels['number']}"></th>
                                    <th th:text="${labels['percentage']}"></th>
                                </tr>
                                <tr style="font-weight: bold;">
                                    <td style="text-align: center;">1</td>
                                    <td style="text-align: center;">2</td>
                                    <td style="text-align: center;">3</td>
                                    <td style="text-align: center;">4</td>
                                    <td style="text-align: center;">5</td>
                                    <td style="text-align: center;">6a</td>
                                    <td style="text-align: center;">6b</td>
                                    <td style="text-align: center;">7a</td>
                                    <td style="text-align: center;">7b</td>
                                    <td style="text-align: center;">7c</td>
                                    <td style="text-align: center;">8a</td>
                                    <td style="text-align: center;">8b</td>
                                    <td style="text-align: center;">9a</td>
                                    <td style="text-align: center;">9b</td>
                                    <td style="text-align: center;">9c</td>
                                    <td style="text-align: center;">9d</td>
                                    <td style="text-align: center;">9e</td>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="data,iterator : ${reportData}">
                                    <td th:text="${iterator.count}"></td>
                                    <td th:text="${data.name}" class="wrap-text"></td><!-- Serial number -->
                                    <td th:text="${data.totalDistrict}"></td>
                                    <td th:text="${data.totalTehsil}"></td>
                                    <td th:text="${data.totalVillage}"></td>
                                    <td th:text="${data.villagesComputerizationCompleted}"></td>
                                    <td th:text="${data.villagesComputerizationCompletedPercent}"></td>
                                    <td th:text="${data.totalMapsFmbTippans}"></td>
                                    <td th:text="${data.totalDigitizedMapsFmbTippans}"></td>
                                    <td th:text="${data.digitizedMapsFmbTippansPercent}"></td>
                                    <td th:text="${data.villagesLinkedWithRor}"></td>
                                    <td th:text="${data.villagesLinkedWithRoRPercent}"></td>
                                    <td th:text="${data.totalSro}"></td>
                                    <td th:text="${data.sroComputerized}"></td>
                                    <td th:text="${data.sroComputerizedPercent}"></td>
                                    <td th:text="${data.sroIntegration}"></td>
                                    <td th:text="${data.sroIntegrationPercent}"></td>
                                </tbody>
                            </table>
                            <script>
    $(document).ready(function () {
        if ($.fn.DataTable.isDataTable('#example2')) {
            // If yes, destroy the existing DataTable instance
            $('#example2').DataTable().destroy();
        }
        $('#example2').DataTable({
            paging: true,  // Enable pagination
            lengthMenu: [10, 25, 50, 100],  // Set page length options
            pageLength: 36,  // Default page length
            drawCallback: function (settings) {
                var api = this.api();
                var totalPages = api.page.info().pages;
                var page = api.page.info().page;
                if (page === totalPages - 1) {
                    $('#example2 tfoot').show();
                } else {
                    $('#example2 tfoot').hide();
                }
            }
        });
    });


                            </script>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
