
<!-- Content Wrapper. Contains page content -->
<div th:fragment="timelineBackup">
  <section class="content">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-12">
          <div class="card card-info">
            <div class="card-header" style="background: linear-gradient(to right, #32b4c8 0%, rgb(64 101 142));">
              <div class="row">
                <div class="col-sm-10">
                  <h3 class="card-title"  style=" color: #eff3f6; font-size: 24px; font-family: auto; text-shadow: 2px 2px 4px #090a0a;  letter-spacing: 2px;"> &nbsp; &nbsp; Timeline Backup</h3>
                </div>

              </div>
            </div>
            <div class="card-body">


              <!-- Corrected URL -->



              <hr>
              <form th:action="@{/dolr/timeline-backup}" method="POST" id="timelineBackup">
                <div class="row">
                  <div class="col-6">
                    <div class="form-group">

                    </div>
                  </div>
                </div>

                <div class="row">
                  <div class="col-12">
                    <button type="submit" class="btn btn-green btn-rounded"
                            style="box-shadow: 0 0 15px 1px rgba(0, 0, 0, 0.4);">
                      Backup
                    </button>
                  </div>
                </div>
              </form>


              <script>
$(document).ready(function() {
    $('#timelineBackup').submit(function(e) {
        e.preventDefault(); // Stop default form submit
        var form = $(this);
        var formData = new FormData(form[0]);

        $.ajax({
            type: 'POST',
            url: form.attr('action'),
            data: formData,
            processData: false,
            contentType: false,
            success: function(data) {
                form[0].reset();
                showSuccessAlert(data);
            },
            error: function(jqXHR) {
                form[0].reset();
                showErrorAlert('Error', jqXHR.responseText);
            }
        });
    });

    function showSuccessAlert(data) {
        Swal.fire({
            title: 'Success',
            text: data,
            icon: 'success',
            confirmButtonText: 'OK'
        });
    }

    function showErrorAlert(title, text) {
        Swal.fire({
            title: title,
            text: text,
            icon: 'error',
            confirmButtonText: 'OK'
        });
    }
});
</script>



            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
