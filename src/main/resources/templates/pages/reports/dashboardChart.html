/*--------------------------------------------------------------
/** 1. VARIABLES
--------------------------------------------------------------*/

/* on mobile devices below 600px
 */
@media screen and (max-width: 600px) {
  :root {

/* Theme Colors */
:root {
  --primary-color: #4CC082;
  --light-primary-color: #E2F3F0;

}

}

}

.tertiary:hover {

}

.gray {
