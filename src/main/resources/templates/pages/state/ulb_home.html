  <style>

.section-title h2 {
  text-align: center;
  padding-bottom: 30px;
}

.section-title h2 {
  font-size: 18px;
  text-transform: uppercase;
  position: relative;
  color: #222222;
}

.section-title h2::before,
.section-title h2::after {
  content: "";
  width: 50px;
  height: 2px;
  background: var(--ux4g-color-primary-600);
  display: inline-block;
}

.section-title h2::before {
  margin: 0 15px 5px 0;
}

.section-title h2::after {
  margin: 0 0 5px 15px;
}
</style>
  <style>
        .count {
            font-size: 36px;
            font-weight: bold;
            color: blue;
        }
        .bg-info {
    background-color: var(--ux4g-bg-primary-strong) !important;
}
    </style>
  <script>
        $(document).ready(function() {
            var countElement = $('#count');
            var count = parseInt(countElement.text());
            var countNum = 0;

            $({ countNum: countElement.text() }).animate({ countNum: count }, {
                duration: 20000,
                easing: 'linear',
                step: function() {
                    countElement.text(Math.floor(this.countNum));
                },
                complete: function() {
                    countElement.text(Math.floor(this.countNum));
                }
            });
        });
    </script>
