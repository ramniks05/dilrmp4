<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layouts/dashboard">

<head>
    <meta charset="UTF-8">
    <title>Computerization of Land Records (CLR)</title>
    <link th:href="@{/css/report/report.css}" rel="stylesheet"/>

</head>

<body>
<div layout:fragment="content"
     style="box-shadow: rgba(9, 30, 66, 0.25) 0px 4px 8px -2px, rgba(9, 30, 66, 0.08) 0px 0px 0px 1px;">
    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-12">
                    <div class="card card-info">
                        <div class="card-header">
                            <div class="row">
                                <div class="col-sm-10">
                                    <h3 class="card-title"
                                        style="font-size: 24px; font-family: auto; text-shadow: 2px 2px 4px #090a0a; letter-spacing: 2px;">
                                        <span th:text="${labels['reportName']}"></span>&nbsp;:
                                        <span th:text="${labels['stateUT']}"></span> -
                                        <span th:text="${stateName}"></span>
                                    </h3>
                                </div>
                                <div class="col-sm-2">
                                    <a th:href="@{/physcial/report/district/pdf/district_clr}">
                                        <img th:src="@{/images/pdf.png}" alt="PDF Icon" class="btn-img" width="40"
                                             height="40"
                                             style="box-shadow: rgba(0, 0, 0, 0.25) 0px 0.0625em 0.0625em, rgba(0, 0, 0, 0.25) 0px 0.125em 0.5em, rgba(255, 255, 255, 0.1) 0px 0px 0px 1px inset;"/>
                                    </a>
                                    <a th:href="@{/physcial/report/excel/clr-district}">
                                        <img th:src="@{/images/excel.png}" alt="EXCEL Icon" class="btn-img" width="40"
                                             height="40"
                                             style="box-shadow: rgba(0, 0, 0, 0.25) 0px 0.0625em 0.0625em, rgba(0, 0, 0, 0.25) 0px 0.125em 0.5em, rgba(255, 255, 255, 0.1) 0px 0px 0px 1px inset;"/>
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div class="card-body">
                            <div>
                                <!-- First heading with the dynamic content -->
                                <h3 class="card-title" style="font-size: 15px; font-weight: bold;">
                                    <span th:text="${labels['genderWonership']}"></span>
                                    <span th:text="${Wonership}"></span>
                                </h3>

                                <!-- Line break to separate the sections -->
                                <br>

                                <!-- Second heading with static text, now placed on a new line -->
                                <h3 class="card-title" style="font-size: 15px; font-weight: bold;">
                                    <span>Note: From Column No. (9) to (17) State Level Data</span>
                                </h3>
                            </div>

                            <div class="table-responsive text-nowrap">
                                <table id="example2" class="table table-bordered  table-striped-columns table-success table-striped  table-responsive">
                                    <thead class="card-info wrap-text" style="background-color: #4a6c52; color:#ffff">
                                    <tr>
                                        <th rowspan="2" th:text="${labels['serialNumber']}"></th>
                                        <th rowspan="2" th:text="${labels['districtName']}"></th>
                                        <th rowspan="2" th:text="${labels['totalTehsils']}"></th>
                                        <th rowspan="2" th:text="${labels['totalVillages']}"></th>
                                        <th colspan="5" th:text="${labels['RoR']}"></th>
                                        <th colspan="2" th:text="${labels['numberOfVillagesWhererCLRCompleted']}"></th>
                                        <th rowspan="2" th:text="${labels['totalNoOfLandOwners']}"></th>
                                        <th colspan="4" th:text="${labels['availabilityOfGenderBasedLandOwnership']}">
                                        </th>
                                        <th colspan="1" th:text="${labels['whetherRoRAvailableOnline']}"></th>
                                        <th colspan="1" th:text="${labels['whetherDigitallySignedRoRAvailableOnline']}">
                                        </th>
                                        <th colspan="1" th:text="${labels['whetherDigitallySignedRoRLegallyValid']}">
                                        </th>
                                        <th colspan="1"
                                            th:text="${labels['whetherMutationApplicationSubmittedOnline']}"></th>
                                        <th colspan="1"
                                            th:text="${labels['whetherAutoTriggeredMutationFacilityAvailable']}"></th>
                                        <!-- //v5 after Auto-Triggered Mutation -->
                                        <th colspan="1"
                                            th:text="${labels['whetherAutoMutationFacilityAvailable']}"></th>
                                        <th colspan="1" th:text="${labels['whetherLandRecordsCheckedOnlineBySRO']}">
                                        </th>
                                        <th colspan="1"
                                            th:text="${labels['whetherLandRecordsCheckedOnlineByRevenueCourts']}"></th>
                                        <th colspan="1"
                                            th:text="${labels['whetherLandRecordsCheckedOnlineByCivilECourtsSystem']}">
                                        </th>
                                    </tr>
                                    <tr>
                                        <!-- //v5 No. of RoR: Total, Computerized, %, with Cadastral Map, % -->
                                        <th th:text="${labels['total']}"></th>
                                        <th th:text="${labels['computerized']}"></th>
                                        <th th:text="${labels['percentage']}"></th>
                                        <th th:text="${labels['rorWithCadastralMap']}"></th>
                                        <th th:text="${labels['percentage']}"></th>
                                        <th th:text="${labels['number']}"></th>
                                        <th th:text="${labels['percentage']}"></th>
                                        <th th:text="${labels['numberOfDistrictsWhereAvailable']}"></th>
                                        <th th:text="${labels['male']}"></th>
                                        <th th:text="${labels['female']}"></th>
                                        <th th:text="${labels['total']}"></th>
                                        <th th:text="${labels['yesNo']}"></th>
                                        <th th:text="${labels['yesNo']}"></th>
                                        <th th:text="${labels['yesNo']}"></th>
                                        <th th:text="${labels['yesNo']}"></th>
                                        <th th:text="${labels['yesNo']}"></th>
                                        <th th:text="${labels['yesNo']}"></th>
                                        <th th:text="${labels['yesNo']}"></th>
                                        <th th:text="${labels['yesNo']}"></th>
                                        <th th:text="${labels['yesNo']}"></th>
                                    </tr>
                                    <tr style="font-weight: bold;">
                                        <td style="text-align: center;">1</td>
                                        <td style="text-align: center;">2</td>
                                        <td style="text-align: center;">3</td>
                                        <td style="text-align: center;">4</td>
                                        <td style="text-align: center;">5a</td>
                                        <td style="text-align: center;">5b</td>
                                        <td style="text-align: center;">5c</td>
                                        <td style="text-align: center;">5d</td>
                                        <td style="text-align: center;">5e</td>
                                        <td style="text-align: center;">6a</td>
                                        <td style="text-align: center;">6b</td>
                                        <td style="text-align: center;">7</td>
                                        <td style="text-align: center;">8a</td>
                                        <td style="text-align: center;">8b</td>
                                        <td style="text-align: center;">8c</td>
                                        <td style="text-align: center;">8d</td>
                                        <td style="text-align: center;">9</td>
                                        <td style="text-align: center;">10</td>
                                        <td style="text-align: center;">11</td>
                                        <td style="text-align: center;">12</td>
                                        <td style="text-align: center;">13</td>
                                        <td style="text-align: center;">14</td>
                                        <td style="text-align: center;">15</td>
                                        <td style="text-align: center;">16</td>
                                        <td style="text-align: center;">17</td>
                                    </tr>
                                    </thead>
                                    <thead>
                                    <tr th:each="grandTotal : ${stateClrData}">
                                        <td></td>
                                        <td style="font-weight: bold;">Grand Total</td>
                                        <td th:text="${grandTotal.totalTehsils != null ? grandTotal.totalTehsils : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.totalVillages != null ? grandTotal.totalVillages : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.totalRor != null ? grandTotal.totalRor : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.rorComputerized != null ? grandTotal.rorComputerized : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.rorComputerizedPercent != null ? grandTotal.rorComputerizedPercent : 0.0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.rorWithCadastralMap != null ? grandTotal.rorWithCadastralMap : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.rorWithCadastralMapPercent != null ? grandTotal.rorWithCadastralMapPercent : 0.0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.villagesClrCompleted != null ? grandTotal.villagesClrCompleted : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.clrCompletionPercent != null ? grandTotal.clrCompletionPercent : 0.0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.totalLandOwners != null ? grandTotal.totalLandOwners : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.districtsWithGenderBasedOwnership != null ? grandTotal.districtsWithGenderBasedOwnership : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.totalMaleLandOwners != null ? grandTotal.totalMaleLandOwners : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.totalFemaleLandOwners != null ? grandTotal.totalFemaleLandOwners : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.totalOwners != null ? grandTotal.totalOwners : 0}"
                                            style="font-weight: bold;"></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                    </thead>

                                    <tbody>
                                    <tr th:each="report,status : ${districtClrData}">
                                        <td th:text="${status.count}"></td>
                                        <td th:text="${report.districtName.toUpperCase()}"></td>
                                        <td th:text="${report.totalTehsils}"></td>
                                        <td th:text="${report.totalVillages}"></td>
                                        <td th:text="${report.totalRor}"></td>
                                        <td th:text="${report.rorComputerized}"></td>
                                        <td th:text="${report.rorComputerizedPercent != null ? (report.rorComputerizedPercent != 0 ? report.rorComputerizedPercent : 0.0) : 0.0}"></td>
                                        <td th:text="${report.rorWithCadastralMap != null ? report.rorWithCadastralMap : 0}"></td>
                                        <td th:text="${report.rorWithCadastralMapPercent != null ? report.rorWithCadastralMapPercent : 0.0}"></td>
                                        <td th:text="${report.villagesClrCompleted}"></td>
                                        <td th:text="${report.clrCompletionPercent != null ? (report.clrCompletionPercent != 0 ? report.clrCompletionPercent : 0.0) : 0.0}"></td>
                                        <td th:text="${report.totalLandOwners}"></td>
                                        <td th:text="${report.districtsWithGenderBasedOwnership}"></td>
                                        <td th:text="${report.totalMaleLandOwners}"></td>
                                        <td th:text="${report.totalFemaleLandOwners}"></td>
                                        <td th:text="${report.totalOwners}"></td>
                                        <td th:text="${report.rorAvailableOnline != null ? report.rorAvailableOnline : 'No'}"></td>
                                        <td th:text="${report.digitallySignedRorAvailable != null ? report.digitallySignedRorAvailable : 'No'}"></td>
                                        <td th:text="${report.digitallySignedRorLegallyValid != null ? report.digitallySignedRorLegallyValid : 'No'}"></td>
                                        <td th:text="${report.onlineMutationFacility != null ? report.onlineMutationFacility : 'No'}"></td>
                                        <td th:text="${report.autoTriggerMutation != null ? report.autoTriggerMutation : 'No'}"></td>
                                        <td th:text="${report.autoMutationFacility != null ? report.autoMutationFacility : 'No'}"></td>
                                        <td th:text="${report.landRecordsOnlineFromRegistrationSystem != null ? report.landRecordsOnlineFromRegistrationSystem : 'No'}"></td>
                                        <td th:text="${report.revenueCourtProceedingsPaperless != null ? report.revenueCourtProceedingsPaperless : 'No'}"></td>
                                        <td th:text="${report.caseFilingRedFlaggedInLandRecordsFromCivilCourts != null ? report.caseFilingRedFlaggedInLandRecordsFromCivilCourts : 'No'}"></td>
                                    </tr>
                                    </tbody>
                                    <tfoot>
                                    <tr th:each="grandTotal : ${stateClrData}">
                                        <td></td>
                                        <td style="font-weight: bold;">Grand Total</td>
                                        <td th:text="${grandTotal.totalTehsils != null ? grandTotal.totalTehsils : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.totalVillages != null ? grandTotal.totalVillages : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.totalRor != null ? grandTotal.totalRor : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.rorComputerized != null ? grandTotal.rorComputerized : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.rorComputerizedPercent != null ? grandTotal.rorComputerizedPercent : 0.0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.rorWithCadastralMap != null ? grandTotal.rorWithCadastralMap : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.rorWithCadastralMapPercent != null ? grandTotal.rorWithCadastralMapPercent : 0.0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.villagesClrCompleted != null ? grandTotal.villagesClrCompleted : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.clrCompletionPercent != null ? grandTotal.clrCompletionPercent : 0.0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.totalLandOwners != null ? grandTotal.totalLandOwners : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.districtsWithGenderBasedOwnership != null ? grandTotal.districtsWithGenderBasedOwnership : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.totalMaleLandOwners != null ? grandTotal.totalMaleLandOwners : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.totalFemaleLandOwners != null ? grandTotal.totalFemaleLandOwners : 0}"
                                            style="font-weight: bold;"></td>
                                        <td th:text="${grandTotal.totalOwners != null ? grandTotal.totalOwners : 0}"
                                            style="font-weight: bold;"></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                    </tfoot>
                                </table>
                                <script>
    $(document).ready(function () {
        // Check if DataTable is already initialized on the table
        if ($.fn.DataTable.isDataTable('#example2')) {
            // If yes, destroy the existing DataTable instance
            $('#example2').DataTable().destroy();
        }

        // Initialize DataTable with your table ID
        $('#example2').DataTable({
            // Add additional options if needed
            paging: true,  // Enable pagination
            lengthMenu: [10, 25, 50, 100],  // Set page length options
            pageLength: 50,  // Default page length
            // Callback function after each draw event
            drawCallback: function (settings) {
                var api = this.api();
                var totalPages = api.page.info().pages;
                var page = api.page.info().page;

                // Check if it's the last page
                if (page === totalPages - 1) {
                    $('#example2 tfoot').show();
                } else {
                    $('#example2 tfoot').hide();
                }
            }
        });
    });



                                </script>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
</body>
</html>
