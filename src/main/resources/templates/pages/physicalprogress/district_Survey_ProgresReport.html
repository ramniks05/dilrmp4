<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layouts/dashboard">

<head>
    <meta charset="UTF-8">
    <title>Survey Resurvey Report (SRP)</title>
    <link th:href="@{/css/report/report.css}" rel="stylesheet"/>
</head>

<body>
<div layout:fragment="content"
     style="box-shadow: rgba(9, 30, 66, 0.25) 0px 4px 8px -2px, rgba(9, 30, 66, 0.08) 0px 0px 0px 1px;">
    <section class="content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <div class="card card-info">
                    <div class="card-header">
                        <div class="row">
                            <div class="col-sm-10">
                                <h3 class="card-title"
                                    style="font-size: 24px; font-family: auto; text-shadow: 2px 2px 4px #090a0a; letter-spacing: 2px;">
                                    <span th:text="${labels['reportName']}"></span>&nbsp;:
                                    <span th:text="${labels['stateUT']}"></span> -
                                    <span th:text="${stateName}"></span>
                                </h3>
                            </div>
                            <div class="col-sm-2">
                                <a th:href="@{/physcial/report/district/pdf/district_survey_resurvey}">
                                    <img th:src="@{/images/pdf.png}" alt="PDF Icon" class="btn-img" width="40"
                                         height="40"
                                         style="box-shadow: rgba(0, 0, 0, 0.25) 0px 0.0625em 0.0625em, rgba(0, 0, 0, 0.25) 0px 0.125em 0.5em, rgba(255, 255, 255, 0.1) 0px 0px 0px 1px inset;"/>
                                </a>
                                <a th:href="@{/physcial/report/excel/survey-district}">
                                    <img th:src="@{/images/excel.png}" alt="EXCEL Icon" class="btn-img" width="40"
                                         height="40"
                                         style="box-shadow: rgba(0, 0, 0, 0.25) 0px 0.0625em 0.0625em, rgba(0, 0, 0, 0.25) 0px 0.125em 0.5em, rgba(255, 255, 255, 0.1) 0px 0px 0px 1px inset;"/>
                                </a>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <a th:href="@{/reports/physical-progress-report}" class="btn btn-primary" style="font-size: 13px;">
                            ← Back
                        </a>
                        <div class="table-responsive text-nowrap">
                            <table id="example2" class="table table-bordered  table-striped-columns table-success table-striped  table-responsive">
                                <thead class="card-info wrap-text" style="background-color: #4a6c52; color:#ffff">
                                <tr>
                                    <th rowspan="2" th:text="${labels['serialNumber']}"></th>
                                    <th rowspan="2" th:text="${labels['districtName']}"></th>
                                    <th rowspan="2" th:text="${labels['totalTehsils']}"></th>
                                    <th rowspan="2" th:text="${labels['totalVillages']}"></th>
                                    <th rowspan="2" th:text="${labels['totalRuralRevenueAreaSqKm']}"></th>
                                    <th rowspan="2" th:text="${labels['areaSanctionedForSurveyResurveySqKm']}"></th>
                                    <th colspan="2" th:text="${labels['dronFlyingCompeted']}"></th>
                                    <th colspan="4" th:text="${labels['numberOfVillages']}"></th>
                                    <th rowspan="2"
                                        th:text="${labels['areaOfVillagesWhereSuveySanctionedNotStarted']}"></th>
                                </tr>
                                <tr>
                                    <th th:text="${labels['numberOfVillages']}"></th>
                                    <th th:text="${labels['areaOfVillagesSqKM']}"></th>
                                    <th th:text="${labels['Map1IsGenerated']}"></th>
                                    <th th:text="${labels['Draftmappublishedobjectionsinvited']}"></th>
                                    <th th:text="${labels['finalPromulgationDone']}"></th>
                                    <th th:text="${labels['surveySanctionedButNotStarted']}"></th>
                                </tr>
                                <tr style="font-weight: bold;">
                                    <td style="text-align: center;">1</td>
                                    <td style="text-align: center;">2</td>
                                    <td style="text-align: center;">3</td>
                                    <td style="text-align: center;">4</td>
                                    <td style="text-align: center;">5</td>
                                    <td style="text-align: center;">6</td>
                                    <td style="text-align: center;">7b</td>
                                    <td style="text-align: center;">7b</td>
                                    <td style="text-align: center;">8a</td>
                                    <td style="text-align: center;">8b</td>
                                    <td style="text-align: center;">8c</td>
                                    <td style="text-align: center;">8d</td>
                                    <td style="text-align: center;">9</td>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="report, status : ${districtSurveyData}">
                                    <td th:text="${status.count}"></td>
                                    <td th:text="${report.districtName.toUpperCase()}"></td>
                                    <td th:text="${report.totalTehsils}"></td>
                                    <td th:text="${report.totalVillages}"></td>
                                    <td th:text="${report.totalRuralRevenueArea}"></td>
                                    <td th:text="${report.areaSanctionedForSurvey}"></td>
                                    <td th:text="${report.villagesDroneFlyingCompleted}"></td>
                                    <td th:text="${report.areaDroneFlyingCompleted}"></td>
                                    <td th:text="${report.villagesMap1Generated}"></td>
                                    <td th:text="${report.villagesDraftMapPublished}"></td>
                                    <td th:text="${report.villagesFinalPromulgationDone}"></td>
                                    <td th:text="${report.villagesSurveySanctionNotStarted}"></td>
                                    <td th:text="${report.areaSurveySanctionNotStarted}"></td>
                                </tr>

                                <tr th:each="grandTotal : ${stateSurveyData}">
                                    <td></td>
                                    <td style="font-weight: bold;">Grand Total</td>
                                    <td th:text="${grandTotal.totalTehsils}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.totalVillages}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.totalRuralRevenueArea}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.areaSanctionedForSurvey}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.villagesDroneFlyingCompleted}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.areaDroneFlyingCompleted}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.villagesMap1Generated}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.villagesDraftMapPublished}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.villagesFinalPromulgationDone}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.villagesSurveySanctionNotStarted}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.areaSurveySanctionNotStarted}" style="font-weight: bold;"></td>
                                </tr>
                                </tbody>
                                <tfoot>
                                <tr th:each="grandTotal : ${stateSurveyData}">
                                    <td></td>
                                    <td style="font-weight: bold;">Grand Total</td>
                                    <td th:text="${grandTotal.totalTehsils}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.totalVillages}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.totalRuralRevenueArea}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.areaSanctionedForSurvey}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.villagesDroneFlyingCompleted}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.areaDroneFlyingCompleted}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.villagesMap1Generated}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.villagesDraftMapPublished}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.villagesFinalPromulgationDone}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.villagesSurveySanctionNotStarted}" style="font-weight: bold;"></td>
                                    <td th:text="${grandTotal.areaSurveySanctionNotStarted}" style="font-weight: bold;"></td>
                                </tr>
                                </tfoot>
                            </table>
                            <script>
    $(document).ready(function () {
        $('#ddlSelect').change(function () {
            var selectedValue = $(this).val();
            if (selectedValue != '') {
                $('#ascDropdown').show();
            } else {
                $('#ascDropdown').hide();
            }
        });
    });
    $('#resetButton').click(function () {
        $('#searchForm')[0].reset();
        $('#searchForm').trigger('submit');
    });




                            </script>
                            <script>
    $(document).ready(function () {
        // Check if DataTable is already initialized on the table
        if ($.fn.DataTable.isDataTable('#example2')) {
            // If yes, destroy the existing DataTable instance
            $('#example2').DataTable().destroy();
        }

        // Initialize DataTable with your table ID
        $('#example2').DataTable({
            // Add additional options if needed
            paging: true,  // Enable pagination
            lengthMenu: [10, 25, 50, 100],  // Set page length options
            pageLength: 25,  // Default page length
            // Callback function after each draw event
            drawCallback: function (settings) {
                var api = this.api();
                var totalPages = api.page.info().pages;
                var page = api.page.info().page;

                // Check if it's the last page
                if (page === totalPages - 1) {
                    $('#example2 tfoot').show();
                } else {
                    $('#example2 tfoot').hide();
                }
            }
        });
    });





                            </script>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <span id="loadingIndicator" class="indicator">Loading...</span>
    </section>
</div>
</body>
</html>
