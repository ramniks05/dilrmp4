<div th:fragment="top-header" class="ux4g-scope dilrmp-topbar">
    <div class="ux4g-topbar" role="region" aria-label="Government of India and accessibility tools">
        <div class="ux4g-container-fluid">
            <div class="ux4g-topbar__wrap ux4g-d-flex ux4g-jc-between ux4g-ai-center">
                <div class="dilrmp-topbar-start ux4g-d-flex ux4g-ai-center">
                    <a class="ux4g-d-flex ux4g-ai-center" href="https://www.india.gov.in/" target="_blank" rel="noopener noreferrer"
                       title="Government of India - National Portal (opens in a new window)">
                        <span class="india-flag" aria-hidden="true"></span>
                        <span class="ux4g-label-m-default"><span lang="hi">भारत सरकार</span> | Government of India</span>
                        <sup class="ux4g-icon-outlined" aria-hidden="true">open_in_new</sup>
                    </a>
                    <a class="ux4g-d-flex ux4g-ai-center" href="https://dilrmp.gov.in/dilrmpold" target="_blank" rel="noopener noreferrer"
                       title="Link to OLD MIS 3.0 (till 14.10.2024) (opens in a new window)">
                        <span class="ux4g-label-m-default">Old MIS 3.0 (till 14.10.2024)</span>
                        <sup class="ux4g-icon-outlined" aria-hidden="true">open_in_new</sup>
                    </a>
                    <span class="dilrmp-visitors ux4g-label-m-default" title="Users currently online (one per browser)">
                        <span class="ux4g-icon-outlined ux4g-top-bar-icon" aria-hidden="true">group</span>
                        Online: <strong th:text="${session.onlineVisitors != null ? session.onlineVisitors : 0}">0</strong>
                    </span>
                    <span class="dilrmp-visitors ux4g-label-m-default" title="Total visitors (first visit count)">
                        Total Visitors: <strong th:text="${session.totalVisitorsFormatted != null ? session.totalVisitorsFormatted : '0'}">0</strong>
                    </span>
                </div>

                <nav aria-label="Accessibility tools" class="dilrmp-topbar-utils ux4g-d-flex ux4g-ai-center">
                    <a class="ux4g-label-m-default ux4g-topbar__skip" href="#main-content">Skip to Main Content</a>
                    <span class="ux4g-bl-1 acc-top-divider" aria-hidden="true"></span>
                    <a class="ux4g-label-m-default ux4g-topbar__skip" th:href="@{/site/help#screen-reader-access}">Screen Reader Access</a>
                    <span class="ux4g-bl-1 acc-top-divider" aria-hidden="true"></span>
                    <div aria-label="Text size controls" class="ux4g-topbar__group ux4g-d-flex ux4g-ai-center" role="group">
                        <button type="button" class="ux4g-topbar__iconbtn ux4g-d-flex ux4g-jc-center ux4g-ai-center"
                                data-gigw-text="dec" aria-label="Decrease text size" title="Decrease text size">
                            <span class="ux4g-icon-outlined ux4g-top-bar-icon" aria-hidden="true">text_decrease</span>
                        </button>
                        <button type="button" class="ux4g-topbar__iconbtn ux4g-d-flex ux4g-jc-center ux4g-ai-center"
                                data-gigw-text="md" aria-label="Normal text size" aria-pressed="true" title="Normal text size">
                            <span class="ux4g-icon-outlined ux4g-top-bar-icon" aria-hidden="true">font_download</span>
                        </button>
                        <button type="button" class="ux4g-topbar__iconbtn ux4g-d-flex ux4g-jc-center ux4g-ai-center"
                                data-gigw-text="inc" aria-label="Increase text size" title="Increase text size">
                            <span class="ux4g-icon-outlined ux4g-top-bar-icon" aria-hidden="true">text_increase</span>
                        </button>
                    </div>
                    <span class="ux4g-bl-1 acc-top-divider" aria-hidden="true"></span>
                    <div aria-label="Colour contrast" class="ux4g-topbar__group ux4g-d-flex ux4g-ai-center" role="group">
                        <button type="button" class="ux4g-topbar__iconbtn ux4g-d-flex ux4g-jc-center ux4g-ai-center"
                                data-gigw-contrast="high" aria-label="High contrast" aria-pressed="false" title="High contrast">
                            <span class="ux4g-icon-outlined ux4g-top-bar-icon" aria-hidden="true">contrast</span>
                        </button>
                        <button type="button" class="ux4g-topbar__iconbtn ux4g-d-flex ux4g-jc-center ux4g-ai-center"
                                data-gigw-contrast="normal" aria-label="Normal contrast" aria-pressed="true" title="Normal contrast">
                            <span class="ux4g-icon-outlined ux4g-top-bar-icon" aria-hidden="true">light_mode</span>
                        </button>
                    </div>
                </nav>
            </div>
        </div>
    </div>
</div>
