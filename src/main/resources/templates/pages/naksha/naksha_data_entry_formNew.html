// Function to toggle the disabled state and required attribute of the Total Professionals Recruited field
function toggleProfessionalsRecruited() {
    var recruitmentStatus = document.getElementById("spmuRecruitmentCompleted").value;
    var professionalsInput = document.getElementById("totalProfessionalsRecruited");

    if (recruitmentStatus === "Yes" || recruitmentStatus === "Initiated" || recruitmentStatus === "Under Process" || recruitmentStatus === "Pending for Approval") {
        professionalsInput.disabled = false;
        professionalsInput.setAttribute("required", "true"); // Make it required when enabled
        console.log('Professionals Recruited field enabled');
    } else {

        professionalsInput.disabled = true;
        professionalsInput.removeAttribute("required");
        professionalsInput.value = ""; // Clear the field
        console.log('Professionals Recruited field disabled and cleared');
    }
}

// Call the function on page load to set initial state
window.onload = toggleProfessionalsRecruited;

                        <script>

$(document).ready(function(){
    const urbanSurveyDropdown = document.getElementById("legalFrameworkUrbanSurveyStatus");
    const amendmentDropdown = document.getElementById("legalFrameworkAmendmentStatus");

    function toggleAmendmentDropdown() {
    const selectedValue = urbanSurveyDropdown.value;
    console.log("Urban Survey selected value:", selectedValue);

    if (selectedValue === "1") {
        amendmentDropdown.disabled = true;
        amendmentDropdown.value = ""; // Clear amendment selection
        console.log("Amendment dropdown disabled");
    } else if (selectedValue === "2") {
        amendmentDropdown.disabled = false;
        amendmentDropdown.setAttribute("required", "true");
        console.log("Amendment dropdown enabled");
    } else if (!selectedValue || selectedValue === "") {
        // Handle null or empty value
        amendmentDropdown.disabled = false;
        amendmentDropdown.value = "";
        console.log("Amendment dropdown enabled (default or null)");
    } else {
        // Fallback
        amendmentDropdown.disabled = false;
        amendmentDropdown.value = "";
        console.log("Amendment dropdown enabled (fallback)");
    }
}


    // Initial toggle on page load
    toggleAmendmentDropdown();

    // Listen for changes in urbanSurveyDropdown
    urbanSurveyDropdown.addEventListener("change", toggleAmendmentDropdown);
});

                        <!-- =====================================================================================
                             SLC Meeting Dates Management Script - CURRENT VERSION (INDEPENDENT)
                             =====================================================================================
                             
                             CURRENT BEHAVIOR:
                             - Field [19] is independent of Field [18]
                             - Dates can be added/removed regardless of Yes/No selection
                             - Backend deletes dates when "No" is selected on submit
                             
                             PREVIOUS BEHAVIOR (Commented below):
                             - Field [19] was dependent on Field [18]
                             - Dates were enabled/disabled based on Yes/No selection
                             - To restore: Uncomment the code at the bottom
                             
                             ===================================================================================== -->
                        <script>
// ========== CURRENT: INDEPENDENT VERSION ==========
// Field [19] dates are independent of Field [18] Yes/No selection
document.addEventListener("DOMContentLoaded", function () {
    const slcSelect = document.getElementById("slcMeetingConducted");
    const addBtn = document.getElementById("addDateBtn");
    const wrapper = document.getElementById("dateInputsWrapper");
    const showBtn = document.getElementById("showDatesBtn");
    const popup = document.getElementById("savedDatesPopup");
    const deletedInputsContainer = document.getElementById("deletedDatesInputs");
    const savedDatesTbody = document.getElementById("savedDatesTbody");
    const newDatesTbody = document.getElementById("newDatesTbody");

    // Helper to enable/disable date inputs and related buttons
    function updateDateFieldsEnabled(shouldEnable) {
        const dateInputs = wrapper.querySelectorAll('input[type="date"]');
        dateInputs.forEach(inp => {
            inp.disabled = !shouldEnable;
            if (!shouldEnable) {
                // When disabling, also remove name so it doesn't submit accidentally
                inp.removeAttribute('name');
            } else if (inp.value) {
                // Re-apply name when enabled and has value
                inp.name = 'slcMeetingDates';
            }
        });

        // Toggle Add button
        if (addBtn) addBtn.disabled = !shouldEnable;

        // Toggle remove buttons
        const removeButtons = wrapper.querySelectorAll('.removeDateBtn');
        removeButtons.forEach(btn => {
            btn.disabled = !shouldEnable;
        });
    }

    // Store previous value to revert if user cancels
    let previousSlcValue = slcSelect.value;

    // Confirmation alert when "No" is selected in Field [18]
    slcSelect.addEventListener("change", function() {
        const selectedValue = this.value;
        const selectedText = this.options[this.selectedIndex] ? this.options[this.selectedIndex].text : '';
        const selectElement = this;
        
        // Check if "No" is selected (value = 0 or text = "No")
        if (selectedValue === '0' || selectedText.toLowerCase() === 'no') {
            // Count existing saved dates
            const savedDatesCount = savedDatesTbody ? savedDatesTbody.querySelectorAll('tr').length : 0;
            const newDatesCount = Array.from(wrapper.querySelectorAll('input[type="date"]')).filter(i => i.value).length;
            const totalDates = savedDatesCount + newDatesCount;
            
            // Show confirmation only if there are dates to delete
            if (totalDates > 0) {
                // Use SweetAlert2 for better UX
                Swal.fire({
                    title: '⚠️ Warning!',
                    html: '<p style="font-size: 16px;">' +
                          'Selecting <strong>"No"</strong> will <strong style="color: #d33;">DELETE</strong> all saved SLC Meeting Dates.<br><br>' +
                          '<span style="color: #e74c3c; font-weight: bold;">Total Dates to be Deleted: ' + totalDates + '</span>' +

                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonColor: '#d33',
                    cancelButtonColor: '#3085d6',
                    confirmButtonText: 'Yes, Delete All Dates',
                    cancelButtonText: 'Cancel',
                    focusCancel: true,
                    reverseButtons: true
                }).then((result) => {
                    if (!result.isConfirmed) {
                        // User cancelled - revert to previous value and re-enable fields
                        selectElement.value = previousSlcValue;
                        updateDateFieldsEnabled(true);
                    } else {
                        // User confirmed - delete all dates immediately and disable inputs
                        previousSlcValue = selectElement.value;
                        
                        // Clear all date input fields
                        const dateInputs = wrapper.querySelectorAll('input[type="date"]');
                        dateInputs.forEach(input => {
                            input.value = '';
                            input.removeAttribute('name');
                        });
                        
                        // Clear saved dates from the list (mark all for deletion)
                        if (savedDatesTbody) {
                            const savedRows = savedDatesTbody.querySelectorAll('tr');
                            savedRows.forEach(row => {
                                const id = row.getAttribute('data-id');
                                const dateVal = row.getAttribute('data-date');
                                
                                // Add hidden input to mark for deletion
                                const input = document.createElement('input');
                                input.type = 'hidden';
                                input.name = id ? 'deletedSlcMeetingDateIds' : 'deletedSlcMeetingDateValues';
                                input.value = id ? id : dateVal;
                                deletedInputsContainer.appendChild(input);
                            });
                            
                            // Clear the table
                            savedDatesTbody.innerHTML = '';
                        }
                        
                        // Clear new dates list
                        if (newDatesTbody) {
                            newDatesTbody.innerHTML = '';
                        }
                        
                        // Hide the popup if visible
                        if (popup.style.display !== 'none') {
                            popup.style.display = 'none';
                            showBtn.textContent = 'Show Date List';
                        }
                        
                        // Disable date fields after selecting No
                        updateDateFieldsEnabled(false);
                        
                        // Show success message
                        Swal.fire({
                            title: 'Dates Cleared!',
                            text: 'All SLC Meeting Dates have been removed from the list.',
                            icon: 'success',
                            timer: 2000,
                            showConfirmButton: false
                        });
                    }
                });
                return;
            }

            // If there are no dates to delete, still disable fields on selecting No
            updateDateFieldsEnabled(false);
        } else {
            // Selecting something other than No -> enable fields
            updateDateFieldsEnabled(true);
        }
        
        // Update previous value if change is confirmed (when no dates to delete)
        previousSlcValue = this.value;
    });

    // Initialize previous value on page load
    if (slcSelect.value) {
        previousSlcValue = slcSelect.value;
    }

    // Initialize date fields enabled state on load based on current selection
    (function initEnableState() {
        const optText = slcSelect.options[slcSelect.selectedIndex] ? slcSelect.options[slcSelect.selectedIndex].text.toLowerCase() : '';
        const isNo = slcSelect.value === '0' || optText === 'no';
        updateDateFieldsEnabled(!isNo);
    })();

    function setMaxDate(input) {
        input.max = new Date().toISOString().split('T')[0];
    }

    addBtn.addEventListener("click", function () {
        const div = document.createElement("div");
        div.classList.add("input-group", "mb-2");

        const input = document.createElement("input");
        input.type = "date";
        // Do NOT name empty inputs so they aren't submitted
        // Name will be applied dynamically when value is present
        input.classList.add("form-control");
        setMaxDate(input);
        input.addEventListener('change', function() {
            // Toggle name attribute based on whether a value exists
            if (input.value) {
                input.name = 'slcMeetingDates';
            } else {
                input.removeAttribute('name');
            }
            refreshNewDatesList();
        });

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.classList.add("btn", "btn-outline-secondary", "btn-icon-xxs", "removeDateBtn");
        removeBtn.innerHTML = '<i class="fa fa-minus"></i>';

        removeBtn.addEventListener("click", function () {
            div.remove();
            refreshNewDatesList();
        });

        div.appendChild(input);
        div.appendChild(removeBtn);
        wrapper.appendChild(div);
    });

    const initialInput = wrapper.querySelector('input[type="date"]');
    if (initialInput) {
        setMaxDate(initialInput);
        // Ensure initial input is only named when it has a value
        if (!initialInput.value) {
            initialInput.removeAttribute('name');
        } else {
            initialInput.name = 'slcMeetingDates';
        }
        initialInput.addEventListener('change', function() {
            if (initialInput.value) {
                initialInput.name = 'slcMeetingDates';
            } else {
                initialInput.removeAttribute('name');
            }
            refreshNewDatesList();
        });
    }

    showBtn.addEventListener("click", function () {
        if (popup.style.display === "none") {
            popup.style.display = "block";
            showBtn.textContent = "Hide Date List";
            sortAllRowsByDateDesc();
        } else {
            popup.style.display = "none";
            showBtn.textContent = "Show Date List";
        }
    });

    function renumberAllRows() {
        const allRows = popup.querySelectorAll('tbody tr');
        allRows.forEach((row, index) => {
            const snCell = row.querySelector('.slc-sn');
            if (snCell) snCell.textContent = (index + 1).toString();
        });
    }

    function refreshNewDatesList() {
        newDatesTbody.innerHTML = '';

        // Build a set of already-saved dates shown in the table to avoid duplicates
        const savedDatesSet = new Set();
        if (savedDatesTbody) {
            savedDatesTbody.querySelectorAll('.slc-date').forEach(td => {
                const val = (td.textContent || '').trim();
                if (val) savedDatesSet.add(val);
            });
        }

        // Collect unique values from current inputs, skipping those already saved
        const dateInputs = wrapper.querySelectorAll('input[type="date"]');
        const uniqueNewValues = [];
        dateInputs.forEach((inp, idx) => {
            const raw = (inp.value || '').trim();
            if (raw.length === 0) {
                // Ensure unnamed when empty so it won't submit
                inp.removeAttribute('name');
                return;
            }
            // Ensure named only when value is present
            inp.name = 'slcMeetingDates';

            if (!savedDatesSet.has(raw) && !uniqueNewValues.includes(raw)) {
                uniqueNewValues.push(raw);

                const tr = document.createElement('tr');
                tr.setAttribute('data-new-index', String(idx));
                tr.innerHTML = '<td class="slc-sn"></td>' +
                               '<td class="slc-date">' + raw + '</td>' +
                               '<td><button type="button" class="btn btn-outline-danger btn-icon-xxs deleteNewDateBtn"><i class="fa fa-trash"></i></button></td>';
                newDatesTbody.appendChild(tr);
            }
        });

        renumberAllRows();
        sortAllRowsByDateDesc();

        // Auto-show the date list when dates are added/changed
        const savedDatesCount = savedDatesTbody ? savedDatesTbody.querySelectorAll('tr').length : 0;
        const newDatesCount = uniqueNewValues.length;
        const totalDates = savedDatesCount + newDatesCount;

        if (totalDates > 0) {
            // Show the list automatically when dates exist
            popup.style.display = 'block';
            showBtn.textContent = 'Hide Date List';
        } else {
            // Hide if no dates
            popup.style.display = 'none';
            showBtn.textContent = 'Show Date List';
        }
    }

    popup.addEventListener('click', function(e) {
        if (e.target && (e.target.classList.contains('deleteSavedDateBtn') || e.target.closest('.deleteSavedDateBtn'))) {
            const row = e.target.closest('tr');
            const id = row.getAttribute('data-id');
            const dateVal = row.getAttribute('data-date');

            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = id ? 'deletedSlcMeetingDateIds' : 'deletedSlcMeetingDateValues';
            input.value = id ? id : dateVal;
            deletedInputsContainer.appendChild(input);

            row.remove();
            renumberAllRows();
            sortAllRowsByDateDesc();
            
            // Check if there are any dates left after deletion
            const remainingSavedDates = savedDatesTbody ? savedDatesTbody.querySelectorAll('tr').length : 0;
            const remainingNewDates = newDatesTbody ? newDatesTbody.querySelectorAll('tr').length : 0;
            const totalRemaining = remainingSavedDates + remainingNewDates;
            
            if (totalRemaining === 0) {
                // Hide the list if no dates remain
                popup.style.display = "none";
                showBtn.textContent = "Show Date List";
            }
        }

        if (e.target && (e.target.classList.contains('deleteNewDateBtn') || e.target.closest('.deleteNewDateBtn'))) {
            const row = e.target.closest('tr');
            const newIndex = row.getAttribute('data-new-index');
            if (newIndex !== null) {
                const group = wrapper.children[Number(newIndex)];
                if (group) group.remove();
                refreshNewDatesList();
            }
        }
    });

    function sortAllRowsByDateDesc() {
        const allRows = [];
        if (savedDatesTbody) {
            savedDatesTbody.querySelectorAll('tr').forEach(r => allRows.push(r));
        }
        if (newDatesTbody) {
            newDatesTbody.querySelectorAll('tr').forEach(r => allRows.push(r));
        }

        allRows.sort((a, b) => {
            const da = (a.querySelector('.slc-date')?.textContent || '').trim();
            const db = (b.querySelector('.slc-date')?.textContent || '').trim();
            if (da === db) return 0;
            return da > db ? -1 : 1;
        });

        if (savedDatesTbody) {
            savedDatesTbody.innerHTML = '';
            allRows.forEach(r => savedDatesTbody.appendChild(r));
        }
        if (newDatesTbody) newDatesTbody.innerHTML = '';
        renumberAllRows();
    }
    sortAllRowsByDateDesc();
    
    // Auto-show list on page load if dates already exist
    const initialSavedDates = savedDatesTbody ? savedDatesTbody.querySelectorAll('tr').length : 0;
    const initialNewDates = newDatesTbody ? newDatesTbody.querySelectorAll('tr').length : 0;
    const initialTotalDates = initialSavedDates + initialNewDates;
    
    if (initialTotalDates > 0) {
        popup.style.display = "block";
        showBtn.textContent = "Hide Date List";
    }
});

        <script>
  function validateFields() {
    let isValid = true;

    // Validate Mobile No
    const mobileno = $('#mobileno').val().trim();
    if (mobileno === '' || mobileno.length !== 10) {
      $("#message_mobileno").text("Enter a valid 10-digit Mobile No.");
      $('#mobileno').focus().css("background-color", "yellow");
      isValid = false;
    } else {
      $("#message_mobileno").text("");
      $('#mobileno').css("background-color", "white");
    }

    // Validate Phone No of Nodal Officer
    const phonenumber = $('#phonenumber').val().trim();
    if (phonenumber === '' || phonenumber.length !== 10) {
      $("#message_phonenumber").text("Enter a valid 10-digit Phone No.");
      $('#phonenumber').focus().css("background-color", "yellow");
      isValid = false;
    } else {
      $("#message_phonenumber").text("");
      $('#phonenumber').css("background-color", "white");
    }

    // Validate Email
    const email = $('#email').val().trim();
    const emailRegex = /^\w+([\.-]?\w+)*@\w+([\.-]?\w+)*(\.\w{2,3})+$/;
    if (email === '') {
      $("#emailError").removeClass("d-none").text("Enter E-Mail Id");
      $('#email').focus().css("background-color", "yellow");
      isValid = false;
    } else if (!emailRegex.test(email)) {
      $("#emailError").removeClass("d-none").text("Invalid E-Mail Id");
      $('#email').focus().css("background-color", "yellow");
      isValid = false;
    } else {
      $("#emailError").addClass("d-none").text("");
      $('#email').css("background-color", "white");
    }

    return isValid;
  }
